/* ---------- игра «Угадай цену» ----------
   Раз в день: бот выбирает коллекцию со свежим флором и держит ответ у себя, пока
   раунд не закончится. Таймер считает бот (deadline), здесь только показ; ответ
   позже срока бот не засчитает. */
let guessTimer = 0;
async function openGuess(){
  clearInterval(guessTimer);
  let g;
  try{ g = await call("guess_start", {}); }
  catch(e){ toast(e.message, "target"); return; }
  if(g.done){ guessResult(g); return; }
  const t0 = Date.now(), total = 20, left0 = g.seconds_left;
  openSheet(`<h2><span class="tile pink">${ic("target")}</span>Угадай цену</h2>
    <p class="sub">Сколько сейчас стоит самый дешёвый подарок этой коллекции? Угадал с точностью 15% - звезда.</p>
    <div class="gstage">${sparkles(8, .5)}
      <svg class="gring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/><circle id="g-arc" cx="60" cy="60" r="54"/></svg>
      ${art(g.slug, g.model, "gart", true)}
      <div class="gsec num" id="g-sec">${left0}</div></div>
    <div class="gname">${esc(collName(g.slug))}${g.model ? ` · ${esc(g.model)}` : ""}</div>
    <div class="gin"><input type="number" inputmode="decimal" id="g-val" placeholder="цена в TON"><span>TON</span></div>
    <button class="btn blue" id="g-go">${ic("check")}Ответить</button>`);
  const arc = $("g-arc"), len = 2 * Math.PI * 54;
  arc.style.strokeDasharray = len;
  let sent = false;
  const send = async () => {
    if(sent) return;
    sent = true;
    clearInterval(guessTimer);
    try{ guessResult(await call("guess_answer", { value: Number(String($("g-val").value).replace(",", ".")) || 0 })); }
    catch(e){ toast(e.message, "target"); }
  };
  const tick = () => {
    const left = Math.max(0, left0 - (Date.now() - t0) / 1000);
    if(!$("g-sec")){ clearInterval(guessTimer); return; }
    $("g-sec").textContent = Math.ceil(left);
    arc.style.strokeDashoffset = len * (1 - left / total);
    $("g-sec").classList.toggle("hot", left <= 5);
    if(left <= 0) send();
  };
  tick();
  guessTimer = setInterval(tick, 100);
  $("g-go").onclick = () => { haptic("medium"); send(); };
  $("g-val").onkeydown = (e) => { if(e.key === "Enter") send(); };
}
function guessResult(g){
  clearInterval(guessTimer);
  const off = g.guess ? Math.round(Math.abs(g.guess - g.answer) / g.answer * 100) : null;
  openSheet(`<h2><span class="tile pink">${ic("target")}</span>Угадай цену</h2>
    <div class="gstage done">${sparkles(8, .5)}${art(g.slug, g.model, "gart", true)}</div>
    <div class="gname">${esc(collName(g.slug))}${g.model ? ` · ${esc(g.model)}` : ""}</div>
    <div class="gres ${g.won ? "win" : ""}">
      <div><span>Цена</span><b class="num">${fmtTon(g.answer)} TON</b></div>
      <div><span>Твой ответ</span><b class="num">${g.guess ? fmtTon(g.guess) + " TON" : "нет"}</b></div></div>
    <p class="sub" style="text-align:center">${g.won ? `Угадал! +${g.prize}` : g.late ? "Время вышло" :
      off !== null ? `Мимо на ${off}%` : "Ответа не было"}. Следующая игра - завтра.</p>`);
  if(g.won){
    hapticOk();
    if(!REDUCED) setTimeout(() => { FX.confetti(); FX.burst(innerWidth / 2, innerHeight * .35, { n: 70, speed: 9, size: 7, life: 70 }); }, 200);
  }
}

/* ===================== ЯДЕРНАЯ КНОПКА =====================
   Красная кнопка, как в «ядерном чемоданчике». Бомба падает на землю внизу экрана,
   и 5 секунд идёт взрыв: вспышка, огненный шар, гриб со стволом, кольцо
   конденсации, пылевая волна у земли, ударная волна трясёт экран. Облако собрано из
   сотен непрозрачных «клубов» (шары со светотенью, от бело-жёлтого до тёмного дыма),
   поэтому оно плотное, а не прозрачное, и закрывает большую часть экрана.
   Белые точки радиации - как засветка на фото: 10 секунд, потом плавно гаснут.
   Зелёные частицы радиации остаются. Интерфейс отбрасывает чуть назад, по бокам
   горят отдельные огоньки; нарисовано поверх и нажатия не перехватывает. Подарки
   мутируют. Всё - до перезагрузки страницы. Звёзды бот даёт только за первый взрыв. */
let NUKED = false, nuking = false;
const BOMB_SVG = `<svg viewBox="0 0 120 220"><defs>
  <linearGradient id="bmb" x1="0" x2="1"><stop offset="0" stop-color="#2d3a22"/><stop offset=".45" stop-color="#6f8a4e"/><stop offset="1" stop-color="#1d2616"/></linearGradient>
  <linearGradient id="bmf" x1="0" x2="1"><stop offset="0" stop-color="#3a4a2c"/><stop offset="1" stop-color="#20291a"/></linearGradient></defs>
  <path d="M30 20h60l-8 34H38z" fill="url(#bmf)"/><path d="M60 14v44" stroke="#151b10" stroke-width="5"/>
  <path d="M20 22h80" stroke="#151b10" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="60" cy="128" rx="46" ry="76" fill="url(#bmb)"/>
  <rect x="14" y="98" width="92" height="20" fill="#ffd60a"/>
  <path d="M14 98h92v20H14z" fill="none" stroke="#151b10" stroke-width="2"/>
  <g fill="#151b10"><path d="M24 98l12 20h8L32 98zM48 98l12 20h8L56 98zM72 98l12 20h8L80 98z"/></g>
  <circle cx="60" cy="160" r="20" fill="#ffd60a"/>
  <g fill="#151b10" transform="translate(60 160)"><circle r="3.6"/>
    <path d="M0-5L-9-15A18 18 0 0 1 9-15z"/><path d="M0-5L-9-15A18 18 0 0 1 9-15z" transform="rotate(120)"/>
    <path d="M0-5L-9-15A18 18 0 0 1 9-15z" transform="rotate(240)"/></g>
  <ellipse cx="42" cy="120" rx="8" ry="44" fill="#fff" opacity=".12"/></svg>`;

// цвета клубов по остыванию: от раскалённого белого к тёмному дыму
const NK_HEAT = ["#ffffff", "#fff8d6", "#ffeaa3", "#ffd06b", "#ffb03f", "#ff8a26", "#f2621a", "#d54414", "#a8330f",
  "#7c2a12", "#5c2716", "#46271c", "#3a2a22", "#352c27", "#3b3430", "#45403b"];
const NK = { cv: null, ctx: null, W: 0, H: 0, dpr: 1, t0: 0, last: 0, raf: 0, spr: null, cool: null, glow: null,
  cap: [], stem: [], dust: [], ring: [], green: [], grain: [], grainAt: 0, phase: "off", T: 0 };
const nkR = (a, b) => a + Math.random() * (b - a);
const nkS = (a, b, x) => { const k = Math.max(0, Math.min(1, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
function hexA(hex, a){
  const n = parseInt(String(hex).slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
/* Клуб дыма: плотная середина, мягкий рваный край, свет сверху и тень снизу, внутри -
   «цветная капуста» из мелких клубочков. Без резкого края и блика, иначе облако
   выглядит как гора шариков. */
function nkBall(c, hot){
  const s = document.createElement("canvas");
  s.width = s.height = 128;
  const g = s.getContext("2d");
  // форма: несколько мягких пятен, вместе - неровный клуб
  for(let i = 0; i < 9; i++){
    const a = Math.random() * Math.PI * 2, d = i ? nkR(10, 26) : 0;
    const x = 64 + Math.cos(a) * d, y = 64 + Math.sin(a) * d, r = i ? nkR(26, 38) : 46;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(.6, "rgba(0,0,0,.95)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  // цвет поверх формы: светлее сверху, темнее снизу
  g.globalCompositeOperation = "source-in";
  const lg = g.createLinearGradient(0, 18, 0, 118);
  lg.addColorStop(0, hot ? shade(c, 1.12) : shade(c, 1.22));
  lg.addColorStop(.5, c);
  lg.addColorStop(1, shade(c, hot ? .86 : .55));
  g.fillStyle = lg; g.fillRect(0, 0, 128, 128);
  // фактура: мелкие светлые и тёмные клубочки
  g.globalCompositeOperation = "source-atop";
  for(let i = 0; i < 46; i++){
    const x = nkR(14, 114), y = nkR(14, 114), r = nkR(5, 15), up = y < 60;
    const gr = g.createRadialGradient(x, y - r * .3, 0, x, y, r);
    gr.addColorStop(0, hexA(shade(c, up ? 1.3 : 1.08), hot ? .22 : .28));
    gr.addColorStop(.7, hexA(shade(c, .7), hot ? .08 : .18));
    gr.addColorStop(1, hexA(c, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  return s;
}
function nkGlow(c){
  const s = document.createElement("canvas");
  s.width = s.height = 64;
  const g = s.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(c, 1)); gr.addColorStop(.25, hexA(c, .55)); gr.addColorStop(1, hexA(c, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, 64, 64);
  return s;
}
function nkSize(){
  if(!NK.cv) return;
  NK.dpr = Math.min(2, window.devicePixelRatio || 1);
  NK.W = innerWidth; NK.H = innerHeight;
  NK.cv.width = Math.round(NK.W * NK.dpr); NK.cv.height = Math.round(NK.H * NK.dpr);
  NK.cv.style.width = NK.W + "px"; NK.cv.style.height = NK.H + "px";
}
function nkSetup(){
  if(!NK.cv){
    NK.cv = document.createElement("canvas");
    NK.cv.id = "nukecv";
    document.body.appendChild(NK.cv);
    NK.ctx = NK.cv.getContext("2d");
    // по три клуба на цвет с разной фактурой - чтобы не повторялись
    NK.spr = NK_HEAT.map((c, i) => [0, 1, 2].map(() => nkBall(c, i < 6)));
    NK.cool = [nkBall("#dfe5ea", false)];
    NK.glow = nkGlow("#8dff4f");
    addEventListener("resize", nkSize);
  }
  nkSize();
}
/* Клубы раскладываются один раз; дальше их положение - функция времени. */
function nkSpawn(){
  NK.cap = [];
  for(let i = 0; i < 230; i++){
    const a = nkR(0, Math.PI * 2), d = Math.sqrt(Math.random());
    NK.cap.push({ s: i % 2 ? 1 : -1, q: nkR(.1, .55), a0: nkR(0, Math.PI * 2), ux: Math.cos(a) * d, uy: Math.sin(a) * d,
      size: nkR(.17, .3), dome: i < 70, dx: nkR(-.78, .78), dy: nkR(-.6, .15), hj: nkR(-1, 1), v: i % 3, rot: nkR(0, 6) });
  }
  NK.stem = [];
  for(let i = 0; i < 70; i++) NK.stem.push({ v0: i / 70, ph: nkR(0, 6), sz: nkR(.8, 1.25), jx: nkR(-.3, .3), v: i % 3, rot: nkR(0, 6) });
  NK.dust = [];
  for(let i = 0; i < 70; i++) NK.dust.push({ side: i % 2 ? 1 : -1, d0: nkR(0, .25), k: nkR(.3, 1.1), sz: nkR(.7, 1.3),
    jy: nkR(-.5, .5), sh: Math.random(), v: i % 3, rot: nkR(0, 6) });
  NK.ring = [];
  for(let i = 0; i < 44; i++) NK.ring.push({ a: i / 44 * Math.PI * 2, sz: nkR(.8, 1.25), v: i % 3, rot: nkR(0, 6) });
  NK.grain = []; NK.grainAt = 0;
}
function nkGeo(T){
  const W = NK.W, H = NK.H, ground = H * .86;
  // шар почти во всю ширину экрана, шапка гриба потом ещё шире
  const Rmax = Math.min(W * .47, H * .27);
  const R = Rmax * (1 - Math.exp(-T * 3.4));
  const capR = R * (1 + .45 * nkS(1, 5, T));
  return { ground, R, capR, cx: W / 2 + Math.sin(T * .7) * 3, cy: ground - R * .92 - H * .3 * nkS(.35, 5, T) };
}
function nkPuff(c, set, x, y, r, p){
  if(r <= .5) return;
  const img = set[p ? p.v : 0] || set[0];
  if(!p){ c.drawImage(img, x - r, y - r, r * 2, r * 2); return; }
  // каждый клуб чуть повёрнут и медленно клубится
  c.save(); c.translate(x, y); c.rotate(p.rot + NK.T * .25 * (p.v - 1));
  c.drawImage(img, -r, -r, r * 2, r * 2);
  c.restore();
}
function nkBlast(c, T){
  const W = NK.W, H = NK.H, { ground, R, capR, cx, cy } = nkGeo(T);
  const fade = 1 - nkS(4.1, 5, T);              // облако рассеивается к концу пятой секунды
  // небо темнеет, всё вокруг подсвечено огнём
  c.globalAlpha = .78 * fade * nkS(0, .3, T);
  c.fillStyle = "#140600"; c.fillRect(0, 0, W, H);
  c.globalAlpha = fade;
  c.globalCompositeOperation = "lighter";
  const lg = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H));
  lg.addColorStop(0, hexA("#ff9a3c", .5 * (1 - nkS(.5, 3.5, T)))); lg.addColorStop(1, hexA("#ff5a00", 0));
  c.fillStyle = lg; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "source-over";
  // пылевая волна у земли
  if(T > .25){
    const spread = W * .85 * (1 - Math.exp(-(T - .25) * .95));
    for(const p of NK.dust){
      const x = cx + p.side * (p.d0 * W * .2 + spread * p.k), y = ground + 14 + p.jy * 22 - nkS(.25, 3, T) * 18;
      const idx = Math.min(15, Math.round((T < 1 ? 7 : 9 + T * 1.2) + p.sh * 3));
      nkPuff(c, NK.spr[Math.min(15, idx)], x, y, (30 + 52 * nkS(.25, 3, T)) * p.sz, p);
    }
  }
  // кольцо конденсации: задняя половина за стволом
  const ringA = nkS(.9, 1.4, T) * (1 - nkS(2.4, 3.3, T)) * fade;
  const ry = ground - (ground - cy) * .55, rx = capR * .9 * (.8 + .4 * nkS(.9, 3.3, T));
  const ringPart = (front) => {
    if(ringA <= .01) return;
    c.globalAlpha = ringA * .7;
    for(const p of NK.ring){
      const sy = Math.sin(p.a);
      // клубы кольца вытянуты вдоль него - выходит сплошная полоса, а не бусы
      const r = 26 * p.sz;
      if((sy > 0) === front) c.drawImage(NK.cool[0], cx + Math.cos(p.a) * rx - r * 1.5, ry + sy * rx * .2 - r * .6, r * 3, r * 1.2);
    }
    c.globalAlpha = fade;
  };
  ringPart(false);
  // ствол: клубы поднимаются от земли к шапке
  const stemW = W * .17 * nkS(.5, 2.4, T);
  if(stemW > 1){
    const top = cy + capR * .45;
    for(const p of NK.stem){
      const v = (p.v0 + T * .2) % 1;
      const y = ground - v * (ground - top);
      const x = cx + Math.sin(v * 8 + p.ph + T) * stemW * .22 + p.jx * stemW * .3;
      // ствол - бурый дым, у земли и под шапкой подсвечен огнём
      const idx = Math.max(6, Math.min(14, Math.round(5 + T * 2.6 + v * 2 - (v > .85 ? 3 : 0))));
      nkPuff(c, NK.spr[idx], x, y, stemW * .62 * p.sz * (1 - v * .25), p);
    }
  }
  ringPart(true);
  // шапка: сначала шар, потом вихревое кольцо (верх клубится наружу, низ внутрь)
  const k = nkS(.35, 1.7, T);
  const list = [];
  for(const p of NK.cap){
    const sx = cx + p.ux * R * .95, sy = cy + p.uy * R * .95;
    let vx, vy;
    if(p.dome){ vx = cx + p.dx * capR; vy = cy + p.dy * capR * .8; }
    else{
      const a = p.a0 + p.s * .75 * T;
      vx = cx + p.s * .5 * capR + p.q * capR * Math.cos(a);
      vy = cy + .06 * capR + p.q * capR * .72 * Math.sin(a);
    }
    const x = sx + (vx - sx) * k, y = sy + (vy - sy) * k;
    // снаружи и сверху остывает быстрее, внутри вихря светится дольше
    const inner = p.dome ? .55 : 1 - p.q * 1.4;
    // за 2 секунды наружный слой становится тёмно-красным дымом, к 3.5 - серым
    const cool = T * 4.1 - inner * 2.6 + p.hj * .7 + (y < cy ? 1 : -.5);
    list.push({ x, y, r: capR * p.size * (.75 + .25 * k), i: Math.max(0, Math.min(15, Math.round(cool))), p });
  }
  // раскалённая середина рисуется первой, остывший дым ложится сверху: снаружи тёмная
  // шапка, огонь виден в складках и снизу (плюс свет изнутри ниже)
  list.sort((a, b) => a.i - b.i);
  for(const q of list) nkPuff(c, NK.spr[q.i], q.x, q.y, q.r, q.p);
  // свет изнутри, сквозь клубы
  c.globalCompositeOperation = "lighter";
  const ig = c.createRadialGradient(cx, cy + capR * .3, 0, cx, cy + capR * .3, capR * 1.05);
  ig.addColorStop(0, hexA("#ff8a2c", .55 * (1 - nkS(2.5, 4.9, T)))); ig.addColorStop(.6, hexA("#ff5a00", .18 * (1 - nkS(2.5, 4.9, T))));
  ig.addColorStop(1, hexA("#ff5a00", 0));
  c.fillStyle = ig; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "source-over";
  // ударная волна по земле и по воздуху
  if(T > .12 && T < 1.8){
    const q = (T - .12) / 1.68, rad = q * Math.hypot(W, H) * 1.1;
    c.globalAlpha = (1 - q) * .9;
    c.strokeStyle = "#ffffff";
    c.lineWidth = 3 + 10 * (1 - q);
    c.beginPath(); c.ellipse(cx, ground, rad, rad * .42, 0, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = (1 - q) * .45;
    c.lineWidth = 2 + 5 * (1 - q);
    c.beginPath(); c.arc(cx, cy, rad * .8, 0, Math.PI * 2); c.stroke();
  }
  // вспышка: первые доли секунды экран белый целиком
  const fl = T < .12 ? 1 : Math.exp(-(T - .12) * 3.6);
  if(fl > .01){ c.globalAlpha = fl; c.fillStyle = "#fffdf5"; c.fillRect(0, 0, W, H); }
  c.globalAlpha = 1;
}
/* Зелёная радиация: яркие светящиеся частицы. Сначала - облако из взрыва, потом
   они остаются и медленно плывут по экрану. */
function nkGreen(c, T, dt){
  const W = NK.W, H = NK.H;
  const rate = NK.phase === "blast" ? (T < .5 ? 0 : 34) : 7;
  let n = rate * dt + Math.random();
  const g = nkGeo(Math.min(T, 5));
  while(n-- >= 1){
    const blast = NK.phase === "blast";
    const a = nkR(0, Math.PI * 2), sp = blast ? nkR(20, 90) : nkR(6, 22);
    NK.green.push({ x: blast ? g.cx + Math.cos(a) * g.capR * nkR(.3, 1.1) : nkR(0, W),
      y: blast ? g.cy + Math.sin(a) * g.capR * nkR(.3, .9) : nkR(0, H),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - nkR(4, 14), r: nkR(1.6, 3.6), life: nkR(2.5, 5), age: 0, ph: nkR(0, 6) });
  }
  c.globalCompositeOperation = "lighter";
  NK.green = NK.green.filter((p) => (p.age += dt) < p.life);
  for(const p of NK.green){
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy *= .985;
    const k = Math.min(1, p.age * 3) * (1 - p.age / p.life);
    const fl = .65 + .35 * Math.sin(p.age * 9 + p.ph);
    c.globalAlpha = k * fl;
    const s = p.r * 7;
    c.drawImage(NK.glow, p.x - s / 2, p.y - s / 2, s, s);
    c.fillStyle = "#e6ffd0";
    c.beginPath(); c.arc(p.x, p.y, p.r * .45, 0, Math.PI * 2); c.fill();
  }
  c.globalCompositeOperation = "source-over";
  c.globalAlpha = 1;
}
/* Белые точки, как засветка на фото: часть держится по 0.35 секунды, часть новая
   в каждом кадре. 10 секунд, потом за 2 секунды гаснут. */
function nkGrain(c, T, now){
  if(T > 12) return;
  const W = NK.W, H = NK.H, dens = T < 10 ? 1 : 1 - (T - 10) / 2;
  const total = Math.round(W * H / 1200);
  if(now - NK.grainAt > 350 || !NK.grain.length){
    NK.grainAt = now;
    NK.grain = [];
    for(let i = 0; i < total * .4; i++) NK.grain.push([nkR(0, W), nkR(0, H), nkR(.5, 1), Math.random() < .12]);
  }
  const dot = (x, y, a, big) => {
    c.globalAlpha = a * dens;
    const s = big ? 1.8 : 1.1;
    c.fillRect(x, y, s, s);
  };
  c.fillStyle = "#ffffff";
  for(const g of NK.grain) dot(g[0], g[1], g[2], g[3]);
  for(let i = 0; i < total * .6; i++) dot(nkR(0, W), nkR(0, H), nkR(.35, 1), Math.random() < .08);
  // редкие точки с оттенком - как на матрице камеры
  c.fillStyle = "#d9ffd0";
  for(let i = 0; i < total * .06; i++) dot(nkR(0, W), nkR(0, H), nkR(.5, 1), false);
  c.globalAlpha = 1;
}
function nkFrame(now){
  NK.raf = requestAnimationFrame(nkFrame);
  if(window.SHOTS_PAUSE) return;
  const dt = Math.min(.05, (now - (NK.last || now)) / 1000);
  NK.last = now;
  // для снимков экрана время можно поставить вручную: window.NK_FREEZE = секунды
  const T = window.NK_FREEZE != null ? window.NK_FREEZE : (now - NK.t0) / 1000;
  NK.T = T;
  const c = NK.ctx;
  c.setTransform(NK.dpr, 0, 0, NK.dpr, 0, 0);
  c.clearRect(0, 0, NK.W, NK.H);
  if(NK.phase === "blast" && T < 5) nkBlast(c, T);
  nkGreen(c, T, dt);
  nkGrain(c, T, now);
  if(NK.phase === "blast" && T >= 5){
    NK.phase = "after";
    NK.cv.style.zIndex = "111";      // дальше радиация - под окнами и уведомлениями
  }
}

async function nukeStart(){
  if(nuking) return;
  nuking = true;
  haptic("heavy");
  const btn = $("nuke-btn");
  if(btn){ btn.classList.add("press"); setTimeout(() => btn.classList.remove("press"), 220); }
  // ответ бота ждём параллельно с полётом: звёзды - только за первый взрыв
  const req = call("bonus_nuke", {}).catch(() => null);
  if(REDUCED){
    NUKED = true; document.body.classList.add("nuked"); fireStart(); mutateArts(document);
    nukeDone(await req, innerWidth / 2, innerHeight / 2, 300);
    return;
  }
  // мутации готовятся, пока падает бомба; покажутся, когда рассеется облако
  mutShowAt = Date.now() + 200 + 1250 + 4300;
  mutateArts(document, true);
  await sleep(200);
  const ground = innerHeight * .86, cx = innerWidth / 2;
  const bomb = document.createElement("div");
  bomb.className = "bomb";
  bomb.innerHTML = BOMB_SVG;
  document.body.appendChild(bomb);
  const fall = bomb.animate([
    { transform: `translate(${cx - 40 + innerWidth * .3}px,-260px) rotate(-35deg) scale(.55)` },
    { transform: `translate(${cx - 40 + innerWidth * .08}px,${ground * .35}px) rotate(-12deg) scale(.8)`, offset: .55 },
    { transform: `translate(${cx - 40}px,${ground - 140}px) rotate(0deg) scale(1)` }],
    { duration: 1250, easing: "cubic-bezier(.45,0,.9,.6)", fill: "forwards" });
  // свист: искры за бомбой
  const trail = setInterval(() => {
    const r = bomb.getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + 10, { n: 4, angle: -Math.PI / 2, spread: .8, speed: 2, size: 4, life: 28,
      gravity: -.05, colors: ["#ffb347", "#ffd60a", "#ffffff"], kind: "dot" });
  }, 40);
  await new Promise((ok) => { fall.onfinish = ok; setTimeout(ok, 1500); });
  clearInterval(trail);
  bomb.remove();
  boom();
  nukeDone(await req, cx, innerHeight * .4, 5200);
}
function boom(){
  nkSetup();
  nkSpawn();
  NK.t0 = performance.now(); NK.last = 0;
  NK.phase = "blast";
  NK.cv.style.zIndex = "249";
  if(!NK.raf) NK.raf = requestAnimationFrame(nkFrame);
  // гул: серия толчков
  [0, 90, 200, 340, 520, 760, 1050].forEach((t, i) => setTimeout(() => haptic(i < 3 ? "heavy" : "medium"), t));
  // ударная волна трясёт интерфейс полторы секунды, затухая
  setTimeout(() => {
    const frames = [];
    for(let i = 0; i <= 30; i++){
      const k = Math.pow(1 - i / 30, 1.6), a = 18 * k;
      frames.push({ transform: i === 30 ? "none" : `translate(${(Math.random() - .5) * a * 2}px,${(Math.random() - .5) * a * 2}px) rotate(${(Math.random() - .5) * k * 3}deg)` });
    }
    [$("nav"), $("fab")].forEach((el) => el && el.animate(frames, { duration: 1500, easing: "linear" }));
    const box = document.querySelector("main");
    if(box) box.animate(frames.map((f) => ({ transform: f.transform === "none" ? "translate(0px,0px)" : f.transform })),
      { duration: 1500, easing: "linear", composite: "add" });
  }, 120);
  // волна отбрасывает интерфейс назад
  setTimeout(() => { NUKED = true; document.body.classList.add("nuked"); }, 300);
  // облако рассеялось - видно огоньки и мутантов
  setTimeout(() => { fireStart(); mutateArts(document, true); }, 4300);
}
function nukeDone(res, x, y, wait){
  setTimeout(() => {
    nuking = false;
    if(res && res.got){
      hapticOk();
      toast(`+${res.got} бонусные звезды за первый взрыв`, "star");
      flyStars(x, y, res.got, res.stars);
      setTimeout(render, 1800);
    }
  }, wait);
}

/* Огонь после взрыва: отдельные огоньки по бокам (каждый - три слоя пламени и своё
   мерцание), лёгкий жар по краям и угольки от огоньков вверх. */
let fireLoop = 0;
function fireStart(){
  if(!$("fire")){
    const f = document.createElement("div");
    f.id = "fire";
    let h = "";
    ["l", "r"].forEach((side) => {
      [7, 21, 36, 50, 63, 77, 90].forEach((y) => {
        if(Math.random() < .3) return;           // не в каждом месте - выглядит живее
        const s = Math.round(nkR(14, 26));
        h += `<span class="flame ${side}" style="top:${(y + nkR(-4, 4)).toFixed(1)}%;--s:${s}px;--d:${nkR(.45, .8).toFixed(2)}s;--dl:${(-Math.random()).toFixed(2)}s">
          <i></i><i></i><i></i></span>`;
      });
    });
    f.innerHTML = `<div class="heat l"></div><div class="heat r"></div>${h}`;
    document.body.appendChild(f);
    f.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
  }
  if(fireLoop || REDUCED) return;
  fireLoop = setInterval(() => {
    if(document.hidden || window.SHOTS_PAUSE) return;
    const fl = document.querySelectorAll("#fire .flame");
    if(!fl.length) return;
    const r = fl[Math.floor(Math.random() * fl.length)].getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height * .2, { n: 1, angle: -Math.PI / 2, spread: .9, speed: 1.6,
      size: 3, life: 70, gravity: -.025, drag: .99, kind: "dot", colors: ["#ffb347", "#ff7a1a", "#ffd27a"] });
  }, 160);
}

/* Мутация подарков: поверх подарка кладётся ДРУГАЯ МОДЕЛЬ той же коллекции,
   обрезанная по фигуре, а сам подарок обрезается по дополняющей фигуре - выходит один
   подарок из частей двух моделей (так попросил владелец: не чужие коллекции, а модели
   этой). Чужая часть играет свою анимацию (до 4 разом, остальные - картинкой). */
/* Стык двух моделей - волной. Обе фигуры строятся по ОДНИМ И ТЕМ ЖЕ точкам волны,
   поэтому части сходятся без щели и без нахлёста. */
function mutShapes(){
  const f = (v) => v.toFixed(1) + "%";
  const amp = nkR(5, 8), freq = nkR(2.2, 3.4) * Math.PI, ph = nkR(0, 6);
  const wave = [];
  for(let i = 0; i <= 24; i++){
    const t = i / 24;
    wave.push([t * 100, Math.sin(t * freq + ph) * amp]);
  }
  const kind = Math.floor(Math.random() * 4);
  const pts = (list) => "polygon(" + list.map(([x, y]) => `${f(x)} ${f(y)}`).join(",") + ")";
  if(kind === 0 || kind === 1){
    // волна поперёк (0) или вдоль (1)
    const at = nkR(42, 58);
    const line = wave.map(([t, w]) => (kind === 0 ? [t, at + w] : [at + w, t]));
    const a = kind === 0 ? [[0, 0], [100, 0], ...line.slice().reverse()] : [[0, 0], ...line, [0, 100]];
    const b = kind === 0 ? [...line, [100, 100], [0, 100]] : [[100, 0], [100, 100], ...line.slice().reverse()];
    return [pts(a), pts(b)];
  }
  if(kind === 2){
    // волна по диагонали
    const line = wave.map(([t, w]) => [t + w * .7, 100 - t + w * .7]);
    return [pts([[0, 0], ...line]), pts([...line, [100, 100]])];
  }
  // волнистое пятно в середине: внутри одна модель, вокруг другая
  const blob = [];
  for(let i = 0; i <= 36; i++){
    const a = i / 36 * Math.PI * 2, r = 30 + Math.sin(a * 6 + ph) * 4;
    blob.push([50 + Math.cos(a) * r, 46 + Math.sin(a) * r]);
  }
  const outer = [[0, 46], [0, 0], [100, 0], [100, 100], [0, 100], [0, 46]];
  return [pts(blob), pts(outer.concat(blob.slice().reverse()))];
}
let mutLive = 0, mutShowAt = 0;
/* Готовим мутации заранее, ещё пока падает бомба: список моделей и картинки чужих
   частей грузятся в это время. Часть показывается, только когда её картинка
   загрузилась и подошло время (облако рассеялось) - раньше модели появлялись
   с задержкой, через несколько секунд после взрыва. */
function mutReveal(el, part){
  let tries = 0;
  const check = () => {
    if(!document.body.contains(el)) return;
    const a = part.querySelector(".art");
    const ready = a && a.dataset.ah && !a.classList.contains("wait") && a.querySelector("img, .mono");
    if((ready || ++tries > 80) && Date.now() >= mutShowAt){
      el.classList.add("mutant");
      part.classList.add("on");
      return;
    }
    setTimeout(check, ready ? Math.max(30, mutShowAt - Date.now()) : 100);
  };
  check();
}
function mutateArts(root, force){
  if(!NUKED && !force) return;
  (root || document).querySelectorAll(".art[data-ac]:not([data-mut])").forEach((el, i) => {
    // в игре подарок должен быть узнаваемым; чужой кусок мутанта сам не мутирует
    if(el.closest(".gstage") || el.closest(".mutpart")) return;
    el.dataset.mut = "1";
    const coll = el.dataset.ac, own = el.dataset.am || "";
    // список моделей коллекции - тот же, что в выборе моделей (кэшируется)
    loadCatalog(coll).then((cat) => {
      const models = ((cat && cat.models) || []).map((m) => m.name).filter((n) => n && n !== own);
      if(!models.length || !document.body.contains(el) || el.querySelector(".mutpart")) return;
      const model = models[Math.floor(Math.random() * models.length)];
      const [mine, theirs] = mutShapes();
      el.style.setProperty("--mclip", theirs);
      const part = document.createElement("div");
      part.className = "mutpart";
      part.style.clipPath = mine;
      part.innerHTML = art(coll, model, "", mutLive < 4);
      if(mutLive < 4) mutLive++;
      el.appendChild(part);
      hydrateArt(part);
      mutReveal(el, part);
    }).catch(() => { /* список моделей не загрузился - подарок остаётся как был */ });
  });
}

/* ===================== СВОИ НАДПИСИ =====================
   Владелец меняет любую надпись прямо в приложении: включает в админке «Режим правки»,
   удерживает палец на надписи и пишет новую. Замены хранятся у бота и приходят всем
   вместе с состоянием, сайт перезаливать не нужно.
   Ключ - исходная надпись; числа в ней заменены на {n}, поэтому «3 коллекции» и
   «12 коллекций» правятся одной записью (у разных падежей - свои записи).
   Применяем ко всему, что появляется на странице (MutationObserver): экранов и
   шторок десятки, и вызвать замену в каждом легко забыть. */
let TX = {};
try{ TX = JSON.parse(localStorage.getItem("gs_tx") || "{}") || {}; }catch(e){ TX = {}; }
const TX_NUM = /\d+(?:[.,  ]\d+)*/g;
const txSeen = new WeakMap();      // узел или поле -> { orig, shown }: что было и что показали
const TX_SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "SELECT"]);

const txKey = (s) => String(s || "").replace(/\s+/g, " ").trim();
function txPattern(s){
  const nums = [];
  const k = txKey(s).replace(TX_NUM, (m) => { nums.push(m); return "{n}"; });
  return { k, nums };
}
/* Язык надписей. Тексты в коде русские; для английского их переводит словарь
   (site/3d0_en.js). Свои надписи владельца хранятся по языкам: русские под исходным
   ключом, английские - под «en:ключ», чтобы правка одного языка не трогала другой. */
let LANG = "ru";
try{ LANG = localStorage.getItem("gs_lang") === "en" ? "en" : "ru"; }catch(e){ LANG = "ru"; }
const CYR = /[А-Яа-яЁё]/;
const EN_RE = (() => {
  const keys = Object.keys(EN_DICT).sort((a, b) => b.length - a.length)
    .map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  // фраза - целыми словами: иначе короткое «до» заменилось бы внутри «Подарок»
  return new RegExp("(^|[^А-Яа-яЁё])(" + keys.join("|") + ")(?=[^А-Яа-яЁё]|$)", "g");
})();
function enText(s){
  for(const [rx, rep] of EN_RX) if(rx.test(s)) return s.replace(rx, rep);
  // дважды: соседние фразы через один пробел второй раз ловятся целиком
  return s.replace(EN_RE, (m, pre, ph) => pre + EN_DICT[ph]).replace(EN_RE, (m, pre, ph) => pre + EN_DICT[ph]);
}
const tr = (s) => (LANG === "en" && CYR.test(String(s || ""))) ? enText(String(s)) : s;
function setLang(lang){
  const next = lang === "en" ? "en" : "ru";
  if(next === LANG) return;
  LANG = next;
  try{ localStorage.setItem("gs_lang", LANG); }catch(e){}
  document.documentElement.lang = LANG;
  txWalk(document.body);
  txObs.takeRecords();
}
/* Чем заменить надпись, или null - оставить как есть. */
function txLookup(text){
  const { k, nums } = txPattern(text);
  if(!k) return null;
  const own = LANG === "en" ? TX["en:" + k] : TX[k];
  if(own != null){
    let i = 0;
    return own.replace(/\{n\}/g, () => (i < nums.length ? nums[i++] : ""));
  }
  if(LANG === "en" && CYR.test(k)){
    const t = enText(txKey(text));
    return t !== txKey(text) ? t : null;
  }
  return null;
}
/* Исходная надпись узла: если сейчас в нём наша замена - то, что было до неё. */
function txOrigOf(n, cur){
  const rec = txSeen.get(n);
  return rec && cur === rec.shown ? rec.orig : cur;
}
function txText(n){
  const orig = txOrigOf(n, n.data);
  const rep = txLookup(orig);
  if(rep == null){
    if(txSeen.has(n)){ txSeen.delete(n); if(n.data !== orig) n.data = orig; }
    return;
  }
  // пробелы по краям оставляем: ими надпись отделена от соседних
  const shown = orig.match(/^\s*/)[0] + rep + orig.match(/\s*$/)[0];
  txSeen.set(n, { orig, shown });
  if(n.data !== shown) n.data = shown;
}
function txPlaceholder(el){
  const cur = el.getAttribute("placeholder");
  if(cur == null || el.closest("[data-notx]")) return;
  const orig = txOrigOf(el, cur), rep = txLookup(orig);
  if(rep == null){
    if(txSeen.has(el)){ txSeen.delete(el); if(cur !== orig) el.setAttribute("placeholder", orig); }
    return;
  }
  txSeen.set(el, { orig, shown: rep });
  if(cur !== rep) el.setAttribute("placeholder", rep);
}
function txWalk(root){
  if(root.nodeType === 3){
    const p = root.parentElement;
    if(p && !TX_SKIP.has(p.tagName) && !p.closest("[data-notx]")) txText(root);
    return;
  }
  if(root.nodeType !== 1 || TX_SKIP.has(root.tagName) && root.tagName !== "INPUT") return;
  if(root.closest("[data-notx]")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: (n) => n.nodeType === 3 ? NodeFilter.FILTER_ACCEPT
      : (TX_SKIP.has(n.tagName) || n.hasAttribute("data-notx")) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP });
  for(let n = w.nextNode(); n; n = w.nextNode()) txText(n);
  if(root.hasAttribute("placeholder")) txPlaceholder(root);
  root.querySelectorAll("[placeholder]").forEach(txPlaceholder);
}
const txObs = new MutationObserver((list) => {
  for(const m of list){
    if(m.type === "childList") m.addedNodes.forEach(txWalk);
    else if(m.type === "characterData") txWalk(m.target);
    else txPlaceholder(m.target);
  }
  // свои же замены тоже попадают в список - выбрасываем, иначе ходили бы по кругу
  txObs.takeRecords();
});
txObs.observe(document.body, { childList: true, subtree: true, characterData: true,
  attributes: true, attributeFilter: ["placeholder"] });

function setTexts(t){
  TX = (t && typeof t === "object") ? t : {};
  try{ localStorage.setItem("gs_tx", JSON.stringify(TX)); }catch(e){}
  txWalk(document.body);
  txObs.takeRecords();
}
txWalk(document.body);

try{ TXEDIT = localStorage.getItem("gs_txedit") === "1"; }catch(e){}

/* Что под пальцем: сама надпись (текстовый узел) или поле с подсказкой внутри. */
function txTargetAt(x, y, el){
  if(el && el.closest("[data-notx]")) return null;
  if(el && el.matches && el.matches("input[placeholder], textarea[placeholder]")) return el;
  let node = null;
  if(document.caretRangeFromPoint){
    const r = document.caretRangeFromPoint(x, y);
    node = r && r.startContainer;
  }else if(document.caretPositionFromPoint){
    const p = document.caretPositionFromPoint(x, y);
    node = p && p.offsetNode;
  }
  if(node && node.nodeType === 3 && txKey(node.data) && el && el.contains(node)) return node;
  // палец попал между буквами: берём первую надпись в нажатом элементе
  const w = el && document.createTreeWalker(el, NodeFilter.SHOW_TEXT,
    { acceptNode: (n) => txKey(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  return w ? w.nextNode() : null;
}
let txHold = null, txSuppress = false, txFrom = null;
document.addEventListener("pointerdown", (e) => {
  if(!TXEDIT || e.target.closest("[data-notx]")) return;
  const x = e.clientX, y = e.clientY, el = e.target;
  txFrom = [x, y];
  clearTimeout(txHold);
  txHold = setTimeout(() => {
    const t = txTargetAt(x, y, el);
    if(!t) return;
    // палец отпустят над кнопкой - этот щелчок не должен её нажать
    txSuppress = true; setTimeout(() => { txSuppress = false; }, 700);
    haptic("medium");
    txOpen(t);
  }, 480);
}, { passive: true });
["pointerup", "pointercancel", "scroll"].forEach((ev) =>
  document.addEventListener(ev, () => clearTimeout(txHold), { passive: true, capture: true }));
document.addEventListener("pointermove", (e) => {
  // палец повёл - это прокрутка, а не удержание
  if(txFrom && Math.hypot(e.clientX - txFrom[0], e.clientY - txFrom[1]) > 10) clearTimeout(txHold);
}, { passive: true });
document.addEventListener("click", (e) => {
  if(txSuppress && !e.target.closest("#txed")){ e.preventDefault(); e.stopPropagation(); txSuppress = false; }
}, true);
// на компьютере - правой кнопкой, на Android долгое нажатие тоже присылает это событие
document.addEventListener("contextmenu", (e) => {
  if(!TXEDIT) return;
  e.preventDefault();
  if($("txed").classList.contains("on") || e.target.closest("[data-notx]")) return;
  clearTimeout(txHold);
  const t = txTargetAt(e.clientX, e.clientY, e.target);
  if(t) txOpen(t);
});

/* Окно правки одной надписи. Своё, а не шторка: правят и надписи в открытой шторке. */
function txOpen(target){
  const cur = target.nodeType === 3 ? target.data : target.getAttribute("placeholder");
  txOpenKey(txPattern(txOrigOf(target, cur)).k);
}
function txOpenKey(key){
  if(!key) return;
  // Владелец правит надпись на том языке, на котором сейчас смотрит приложение.
  const sk = LANG === "en" && !key.startsWith("en:") ? "en:" + key : key;
  const was = sk.startsWith("en:") ? enText(sk.slice(3)) : key;
  const has = TX[sk] != null, withNum = key.includes("{n}");
  $("txed").innerHTML = `<div class="txcard">
    <h3>Изменить надпись</h3>
    <div class="txwas"><span>Было</span>${esc(was)}</div>
    <textarea id="txin" rows="3" maxlength="500"></textarea>
    ${withNum ? `<div class="hint">{n} - сюда встанет число, его можно переставить или убрать.</div>` : ""}
    <div class="hint">Поменяется везде, где стоит эта надпись, у всех пользователей.</div>
    <div class="err" id="txerr"></div>
    <div class="txbtns"><button class="btn" id="txno">Отмена</button>
      <button class="btn blue" id="txok">${ic("check")}Сохранить</button></div>
    ${has ? `<button class="btn ghost" id="txback">Вернуть как было</button>` : ""}</div>`;
  $("txin").value = has ? TX[sk] : was;
  $("txed").classList.add("on");
  setTimeout(() => { const i = $("txin"); i.focus(); i.select(); }, 60);
  const done = () => $("txed").classList.remove("on");
  const send = async (val) => {
    try{
      await call("admin", { texts: { [sk]: val } });
      done(); hapticOk(); toast(val ? "Надпись изменена" : "Надпись возвращена");
      if($("v-admin").classList.contains("on")) render();
    }catch(err){ $("txerr").textContent = err.message; }
  };
  $("txno").onclick = done;
  $("txok").onclick = () => {
    const val = txKey($("txin").value);
    if(!val){ $("txerr").textContent = "Напиши новую надпись или нажми «Вернуть как было»"; return; }
    send(val === was ? "" : val);
  };
  if(has) $("txback").onclick = () => send("");
}
$("txed").addEventListener("click", (e) => { if(e.target === $("txed")) $("txed").classList.remove("on"); });

  }
  if(action === "alert_del"){ DEMO_S.alerts = (DEMO_S.alerts || []).filter((a) => a.id !== payload.id); return { ok: true, state: DEMO_S }; }
  if(action === "banners") return { on: DEMO_S.banners_on !== false, items: DEMO_S.banners,
    stats: { d1: { views: 412, taps: 37 } } };
  // в демо картинка остаётся в памяти страницы
  if(action === "banner_image"){ DEMO_S._img = payload.data; return { ok: true, file: "demo.jpg" }; }
  if(action === "banner_seen" || action === "banner_tap") return { ok: true };
  if(action === "banner_save"){
    if("on" in payload){ DEMO_S.banners_on = !!payload.on; return { ok: true, state: DEMO_S }; }
    const b = Object.assign({}, payload.banner);
    if(b.bg && !b.bg.image && !b.bg.color) b.bg = { color: "violet" };
    if(b.bg && b.bg.image === "demo.jpg") b._local = DEMO_S._img;
    if(b.id) DEMO_S.banners = DEMO_S.banners.map((x) => (x.id === b.id ? b : x));
    else { b.id = "d" + Date.now(); DEMO_S.banners.push(b); }
    return { ok: true, banner: b, state: DEMO_S };
  }
  if(action === "banner_del"){ DEMO_S.banners = DEMO_S.banners.filter((x) => x.id !== payload.id); return { ok: true, state: DEMO_S }; }
  if(action === "banner_move"){
    const i = DEMO_S.banners.findIndex((x) => x.id === payload.id), j = Math.max(0, Math.min(DEMO_S.banners.length - 1, i + payload.step));
    [DEMO_S.banners[i], DEMO_S.banners[j]] = [DEMO_S.banners[j], DEMO_S.banners[i]];
    return { ok: true, state: DEMO_S };
  }
  if(action === "alert_rearm"){ (DEMO_S.alerts || []).forEach((a) => { if(a.id === payload.id) a.active = true; }); return { ok: true, state: DEMO_S }; }
  if(action === "settings"){
    if(payload.quiet) DEMO_S.settings.quiet = payload.quiet.mode === "off" ? null : payload.quiet;
    if(payload.lang) DEMO_S.lang = payload.lang;
    return { ok: true, state: DEMO_S };
  }
  if(action === "slot_invoice") return { link: "" };
  if(action === "bonus_claim"){
    const b = DEMO_S.bonus, now = Math.floor(Date.now() / 1000);
    if(b.next_claim > now) throw new Error("следующий бонус через 23 ч 59 мин");
    b.stars += 2; b.next_claim = now + 86400; b.now = now;
    return { stars: b.stars, got: 2, state: DEMO_S };
  }
  if(action === "bonus_nuke"){
    const b = DEMO_S.bonus;
    if(b.nuke_done) return { stars: b.stars, got: 0 };
    b.nuke_done = true; b.stars += 4; b.achievements.nuke = Math.floor(Date.now() / 1000);
    return { stars: b.stars, got: 4 };
  }
  if(action === "bonus_buy") throw new Error("покупка откроется после 15 дней в приложении, сейчас 9");
  if(action === "bonus_ledger") return { items: [
    { ts: Math.floor(Date.now() / 1000) - 3600, delta: 2, reason: "daily" },
    { ts: Math.floor(Date.now() / 1000) - 90000, delta: 2, reason: "ach:days_7" },
    { ts: Math.floor(Date.now() / 1000) - 200000, delta: 2, reason: "ach:first_slot" },
    { ts: Math.floor(Date.now() / 1000) - 300000, delta: 1, reason: "ach:first_coll" }] };
  if(action === "guess_start"){
    if(!DEMO_S.guess) DEMO_S.guess = { slug: "plushpepe", model: "", done: false, started: Date.now() };
    const g = DEMO_S.guess, left = Math.max(0, 20 - Math.floor((Date.now() - g.started) / 1000));
    return g.done ? g : { slug: g.slug, model: "", done: false, seconds_left: left };
  }
  if(action === "guess_answer"){
    const g = DEMO_S.guess, v = Number(payload.value) || 0;
    Object.assign(g, { done: true, answer: 1240, guess: v || null, prize: 1,
      won: v > 0 && Math.abs(v - 1240) <= 186, late: Date.now() - g.started > 23000 });
    if(g.late) g.won = false;
    return g;
  }
  if(action === "admin"){
    if(payload.texts_reset) DEMO_S.texts = {};
    // как на сервере: пустая замена или равная исходной - вернуть как было
    Object.entries(payload.texts || {}).forEach(([k, v]) => {
      const key = txKey(k), val = txKey(v);
      DEMO_S.texts = Object.assign({}, DEMO_S.texts);
      if(!val || val === key) delete DEMO_S.texts[key]; else DEMO_S.texts[key] = val;
    });
    if(payload.effects) Object.assign(DEMO_S.admin.effects, payload.effects);
    Object.assign(DEMO_S.effects, DEMO_S.admin.effects); return { ok: true, state: DEMO_S }; }
  if(action === "portfolio"){
    const hour = 3600e3, now = Math.floor(Date.now() / hour) * hour, pts = [];
    let v = 900;
    for(let i = 24 * 30; i >= 0; i--){
      v += Math.sin(i / 9.3) * 6 + (Math.random() - .45) * 9;
      pts.push({ t: now - i * hour, v: Math.round(Math.max(300, v) * 100) / 100 });
    }
    const items = [
      { id: 1, slug: "PlushPepe", title: "Plush Pepe", model: "Midas Pepe", backdrop: "Pure Gold", qty: 1,
        value: 612.5, change_24h: 4.1, market_price: 612.5, own_price: null },
      { id: 2, slug: "DurovsCap", title: "Durov's Cap", model: "Cotton Candy", backdrop: "Mexican Pink", qty: 2,
        value: 318.4, change_24h: -1.2, market_price: 159.2, own_price: null },
      { id: 3, slug: "IonGem", title: "Ion Gem", model: "Kryptonite", backdrop: "Emerald", qty: 1,
        value: 171.9, change_24h: 2.6, market_price: 171.9, own_price: null },
      { id: 4, slug: "LootBag", title: "Loot Bag", model: "Pepe Bag", backdrop: "Black", qty: 3,
        value: 83.6, change_24h: 0.4, market_price: 27.9, own_price: null }];
    const total = items.reduce((a, x) => a + x.value, 0);
    const scale = total / pts[pts.length - 1].v;
    pts.forEach((p) => { p.v = Math.round(p.v * scale * 100) / 100; });
    const dayAgo = pts[pts.length - 25] || pts[0];
    return { total, change_24h: Math.round(((total - dayAgo.v) / dayAgo.v) * 1e4) / 100,
      updated: new Date(now).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }),
      chart: pts, marks: [{ t: now - 19 * hour, title: "добавлен Ion Gem" }],
      notify: { on: true, moves: true, threshold: 10, summary_at: "20:00", summary_every: "day", weekly: true }, items };
  }
  if(action === "texts") return { help: "Помощь: как пользоваться ботом.", terms: "Условия пользования.",
    support: "Опиши вопрос одним сообщением.", open_tickets: 0 };
  if(action === "support_send") return { ok: true, id: 7 };
  if(action === "referral") return { link: "https://t.me/giftflip_bot?start=ref_1204450614",
    percent: 20, invited: 4, paid: 2, discounts: 1 };
  if(action === "tickets") return { items: [
    { id: 12, uid: 555, text: "Не приходят уведомления по Plush Pepe", date: "10.10 10:14", answered: false },
    { id: 11, uid: 777, text: "Как купить слот?", date: "09.10 19:02", answered: true }] };
  return { ok: true, state: DEMO_S };
}

/* ===================== ЗАГРУЗКА =====================
   Под экраном загрузки уже нарисована главная (с прошлого захода или заготовка) и
   размыта. Логотип вылетает из-за нижнего края с хвостом искр, растёт к центру,
   покачивается и взрывается частицами - как тотем бессмертия. Когда данные готовы,
   логотип улетает «в экран», размытие тает. Эффект выключается в админке - тогда
   логотип просто стоит в центре. */
const TOTEM = ["#ffffff", "#bfe0ff", "#6cc6ff", "#2f9bff", "#ffe27a", "#9ff0ff"];
const BOOT_FLY = 1250;
let bootSpark = 0;
function logoCenter(){
  const r = $("boot-logo").getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function bootFly(){
  const w = $("boot-logo");
  const P3 = "perspective(700px)";
  w.animate([
    { transform: `${P3} translate(-24vw, 72vh) scale(.14) rotate(-38deg) rotateY(75deg)`, opacity: 0,
      easing: "cubic-bezier(.32,.5,.3,1)" },
    { opacity: 1, offset: .08 },
    { transform: `${P3} translate(0, 0) scale(1.55) rotate(9deg) rotateY(-24deg)`, offset: .5, easing: "ease-in-out" },
    { transform: `${P3} scale(.9) rotate(-5deg) rotateY(14deg)`, offset: .67, easing: "ease-in-out" },
    { transform: `${P3} scale(1.07) rotate(2deg) rotateY(-6deg)`, offset: .83, easing: "ease-in-out" },
    { transform: `${P3} scale(1) rotate(0) rotateY(0)`, opacity: 1 },
  ], { duration: BOOT_FLY, fill: "both" });
  // хвост из искр за летящим логотипом
  const t0 = performance.now();
  const tail = () => {
    if(performance.now() - t0 > BOOT_FLY * .48) return;
    const [x, y] = logoCenter();
    // пока логотип за краем экрана, искры не сыплем: копятся облаком внизу
    if(y < innerHeight - 20) FX.burst(x, y, { n: 3, speed: 2.4, gravity: .03, drag: .95, life: 40, size: 5,
      colors: TOTEM, kinds: ["px", "star", "dot"] });
    requestAnimationFrame(tail);
  };
  requestAnimationFrame(tail);
  // прилёт: вспышка и взрыв частиц, часть искр потом медленно всплывает
  setTimeout(() => {
    const [x, y] = logoCenter(), b = $("boot");
    b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
    haptic("medium");
    FX.burst(x, y, { n: 150, speed: 13, gravity: .07, drag: .965, life: 95, size: 7, colors: TOTEM,
      kinds: ["px", "px", "star", "dot"], ring: 70 });
    FX.burst(x, y, { n: 60, speed: 5, gravity: -.025, drag: .985, life: 150, size: 4.5, colors: TOTEM,
      kinds: ["px", "star"], ring: 80 });
  }, BOOT_FLY * .5);
  // пока ждём данные - вокруг логотипа то и дело вспыхивают искры
  clearInterval(bootSpark);
  bootSpark = setInterval(() => {
    const [x, y] = logoCenter(), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 40;
    FX.burst(x + Math.cos(a) * d, y + Math.sin(a) * d, { n: 3, speed: 1.2, gravity: -.02, drag: .97,
      life: 55, size: 5, colors: TOTEM, kinds: ["star", "px"] });
  }, 260);
}
function bootStart(){
  const b = $("boot"), w = $("boot-logo");
  w.getAnimations().forEach((x) => x.cancel());
  w.innerHTML = `<div class="lg-float">${BRAND.svg}</div>`;
  const anim = fxOn("boot");
  b.classList.remove("play", "out", "still", "gone", "hit");
  void b.offsetWidth;
  b.classList.add(anim ? "play" : "still");
  if(anim) bootFly();
  return anim;
}
async function bootHide(anim){
  const b = $("boot");
  clearInterval(bootSpark);
  if(anim){
    const [x, y] = logoCenter();
    $("boot-logo").animate([
      { transform: "scale(1)", opacity: 1, filter: "blur(0)" },
      { transform: "scale(.86)", opacity: 1, filter: "blur(0)", offset: .25 },
      { transform: "scale(2.7)", opacity: 0, filter: "blur(6px)" },
    ], { duration: 520, easing: "cubic-bezier(.5,0,.75,.4)", fill: "forwards" });
    setTimeout(() => FX.burst(x, y, { n: 110, speed: 15, size: 7, life: 70, gravity: .06, colors: TOTEM,
      kinds: ["px", "star", "dot"], ring: 60 }), 140);
    b.classList.add("out");
    await sleep(540);
  }
  b.classList.add("gone");
}
/* Что видно под размытием, пока бот не ответил: главная с прошлого захода, а при
   первом запуске - заготовка из пустых карточек. */
function homeSkeleton(){
  return `<div class="skel"><i style="width:38%;height:20px"></i><i style="width:72%;height:38px;margin-top:14px"></i>
    <i style="height:70px;margin-top:22px;border-radius:24px"></i>
    <i style="height:210px;margin-top:14px;border-radius:30px"></i>
    <div style="display:flex;gap:12px;margin-top:12px"><i style="height:160px;flex:1;border-radius:28px"></i>
      <i style="height:160px;flex:1;border-radius:28px"></i></div></div>`;
}
function bootBackdrop(){
  let st = null;
  if(DEMO) st = demoState();
  else try{ st = JSON.parse(localStorage.getItem("gs_last") || "null"); }catch(e){ st = null; }
  if(st && st.uid){
    try{ setState(st); render(); return; }
    // сохранённое состояние могло остаться от старой версии сайта - тогда заготовка
    catch(e){ console.warn("старое состояние:", e); S = null; }
  }
  $("v-home").innerHTML = homeSkeleton();
}
function rememberState(){
  if(DEMO || !S) return;
  try{ localStorage.setItem("gs_last", JSON.stringify(S)); }catch(e){ /* память браузера полна - просто не запомним */ }
}
async function boot(){
  artIndex();
  const t0 = performance.now();
  bootBackdrop();
  const anim = bootStart();
  // Для выбора логотипа: экран загрузки стоит на месте (?boothold=1) или
  // проигрывается по кругу (?bootloop=1).
  if(P.get("boothold") === "1") return;
  if(P.get("bootloop") === "1"){
    for(;;){ await sleep(2600); await bootHide(true); await sleep(900); bootStart(); }
  }
  if(!API && !DEMO){
    await bootHide(false);
    $("v-home").innerHTML = `<div class="empty" style="margin-top:40px"><b>Не задан адрес бота</b>
      Открой приложение кнопкой в боте.</div>`;
    return;
  }
  try{
    const data = await call("state", {});
    setState(data.uid ? data : data.state);
    // Человеческие названия коллекций («Loot Bag», а не «LootBag») берутся из
    // каталога. Ждём его недолго: без каталога экран всё равно рисуется.
    await Promise.race([artIndex(), sleep(2000)]);
    render();
    rememberState();
    startRefresh();
    // логотип должен успеть долететь и немного покрасоваться
    if(anim) await sleep(Math.max(0, BOOT_FLY + 700 - (performance.now() - t0)));
    await bootHide(anim);
    moveInd();
  }catch(e){
    $("boot-sub").textContent = "Нет связи с ботом";
    await sleep(900);
    await bootHide(false);
    $("v-home").innerHTML = `<div class="empty" style="margin-top:40px"><b>Не соединился с ботом</b>
      ${esc(e.message)}<br><br>Адрес данных: <span class="num">${esc(API || "не задан")}</span><br>
      Проверь, что бот запущен: <span class="num">${esc(API)}/api/ping</span> должен ответить «ok».</div>`;
  }
}

/* ===================== ЗАПУСК ===================== */
document.querySelectorAll("nav [data-go]").forEach((b) => b.onclick = () => { haptic(); go(b.dataset.go); });
$("veil").onclick = closeSheet;
addEventListener("resize", moveInd);
/* В Telegram окно приложения меняет размер без события resize (разворачивается,
   появляется полоса), а шрифт догружается позже первой отрисовки: бегунок вкладок
   считался по старым размерам и стоял не на своём месте, пока не понажимаешь. */
if("ResizeObserver" in window) new ResizeObserver(() => moveInd()).observe($("nav"));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);

/* Щипок и двойное касание: iOS игнорирует meta viewport внутри WebView. */
["gesturestart", "gesturechange", "gestureend"].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", (e) => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });
/* Двойное касание НЕ гасим в touchend: так терялось второе быстрое нажатие (две
   цифры подряд, две модели подряд). Увеличение по двойному касанию отключает
   touch-action: manipulation в стилях - нажатия при этом доходят все. */

if(TG){
  TG.ready(); TG.expand();
  /* На весь экран, без шапки Telegram (Telegram 8.0 и новее). Только на телефоне:
     на компьютере приложение на весь монитор только мешает. Старый Telegram
     полноэкранного режима не знает - тогда остаётся обычное развёрнутое окно. */
  try{
    if(TG.requestFullscreen && TG.isVersionAtLeast && TG.isVersionAtLeast("8.0") &&
       ["ios", "android"].includes(TG.platform) && !TG.isFullscreen) TG.requestFullscreen();
  }catch(e){ /* не поддерживается - остаёмся в обычном окне */ }
  try{
    if(TG.onEvent){
      ["viewportChanged", "fullscreenChanged", "safeAreaChanged", "contentSafeAreaChanged"].forEach((ev) => TG.onEvent(ev, moveInd));
    }
  }catch(e){ /* старый клиент без событий */ }
  try{ TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){}
  try{ TG.setHeaderColor("#000000"); TG.setBackgroundColor("#000000"); TG.setBottomBarColor && TG.setBottomBarColor("#000000"); }catch(e){}
  if(TG.BackButton) TG.BackButton.onClick(() => {
    if($("sheet").classList.contains("on")) closeSheet(); else if(!ORDER.includes(VIEW)) go("profile");
  });
  const sp = String((TG.initDataUnsafe && TG.initDataUnsafe.start_param) || "").toLowerCase();
  if(["sniper", "flip", "portfolio", "profile", "settings"].includes(sp)) VIEW = sp;
}
const startView = P.get("view");
if(startView && document.getElementById("v-" + startView)) VIEW = startView;
if(VIEW !== "home") go(VIEW);
moveInd();
boot();
</script>
