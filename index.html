<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>GiftFlip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Проигрыватель анимаций подарков. Лёгкая сборка (только SVG): анимации Telegram
     не используют выражений, а полная сборка втрое тяжелее. Если файл не загрузится,
     подарки останутся картинками PNG - пустого места не будет. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js" defer></script>
<style>
/* Мобильная вёрстка в духе iOS: чёрный фон, графитовые карточки, синий акцент.
   Эмодзи не используются: системные выглядят по-разному на каждом телефоне. */
:root{
  --bg:#000; --s1:#1c1c1e; --s2:#2c2c2e; --s3:#3a3a3c; --s4:#48484a;
  --sep:rgba(84,84,88,.36); --line:rgba(255,255,255,.07);
  --text:#fff; --muted:#8e8e93; --muted-2:#636366;
  --blue:#2f7cf6; --blue-2:#5a9bff; --blue-d:#1d5fd6;
  --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a;
  --purple:#bf5af2; --pink:#ff375f; --teal:#40c8e0; --indigo:#5e5ce6; --mint:#63e6be;
  --pill:#e9e9ee;
  --r-xl:30px; --r-l:24px; --r-m:18px; --r-s:13px;
  --tab-h:66px; --tab-gap:12px;
  --spring:cubic-bezier(.2,.9,.25,1.12);
  --ease:cubic-bezier(.25,.8,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:16px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  /* Щипок и двойное касание не должны менять масштаб: iOS игнорирует meta, поэтому
     ещё touch-action и обработчики в коде. */
  touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-bottom:calc(var(--tab-h) + var(--tab-gap) * 2 + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none;padding:0}
input,select,textarea{font:inherit}
img{display:block}

/* ---------- экран загрузки ---------- */
#boot{position:fixed;inset:0;z-index:200;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .45s ease,visibility .45s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#boot .bveil{position:absolute;inset:0;background:rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);transition:opacity .55s ease}
#boot.out .bveil{opacity:0}
#boot.out .rays,#boot.out .halo{transition:opacity .4s;opacity:0!important}
#boot .rays{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;
  transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(90,155,255,.13) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#boot .halo{position:absolute;left:50%;top:44%;width:420px;height:420px;border-radius:50%;
  transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(47,124,246,.55),rgba(47,124,246,.12) 45%,transparent 70%)}
#boot .logo-wrap{position:relative;width:132px;height:132px;margin-top:-6vh;will-change:transform}
#boot .logo-wrap svg{width:100%;height:100%;overflow:visible}
#boot .word{margin-top:26px;font-size:30px;font-weight:850;letter-spacing:-.8px;opacity:0;
  transform:translateY(10px)}
#boot .tag{margin-top:6px;font-size:14px;color:var(--muted);opacity:0;transform:translateY(8px)}
#boot .load{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));left:50%;
  width:120px;height:4px;border-radius:2px;background:var(--s2);overflow:hidden;
  transform:translateX(-50%);opacity:0;transition:opacity .3s}
#boot .load i{display:block;height:100%;width:38%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--blue-2),#fff,var(--blue-2),transparent);
  animation:slide 1.1s ease-in-out infinite}
#boot .msg{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:13px;color:var(--muted)}
/* Полёт логотипа задаёт JS (bootFly): из-за нижнего края, с разворотом, как тотем
   бессмертия. CSS - только то, что появляется после прилёта. */
#boot.play .logo-wrap{opacity:0}
#boot.play .rays{animation:raysIn 1s var(--ease) .55s forwards, spin 26s linear infinite}
#boot.play .halo{animation:haloIn .9s var(--spring) .52s forwards}
#boot.play .word{animation:fadeUp .5s var(--ease) .8s forwards}
#boot.play .tag{animation:fadeUp .5s var(--ease) .92s forwards}
#boot.play .load{opacity:1;transition-delay:1.1s}
#boot.hit .flash{animation:flash .55s ease-out}
#boot.out .word,#boot.out .tag,#boot.out .load,#boot.out .msg{transition:.25s;opacity:0}
#boot.out .flash{animation:flash .6s ease-out forwards}
#boot .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,#fff,rgba(120,175,255,.6) 30%,transparent 70%);
  opacity:0;pointer-events:none}
@keyframes raysIn{to{opacity:.6}}
@keyframes haloIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes flash{0%{opacity:0}35%{opacity:.85}100%{opacity:0}}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- частицы и эффекты ---------- */
#fx{position:fixed;inset:0;z-index:250;pointer-events:none}
.fly{position:fixed;z-index:160;pointer-events:none;will-change:transform,opacity}
.fly .glow{position:absolute;inset:-40%;border-radius:50%;
  background:radial-gradient(circle,rgba(120,175,255,.75),rgba(47,124,246,.25) 45%,transparent 70%);
  animation:glowPulse .9s ease-out forwards}
.fly .beams{position:absolute;inset:-120%;
  background:repeating-conic-gradient(rgba(255,255,255,.18) 0deg 5deg,transparent 5deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);
  animation:beams 1s ease-out forwards}
@keyframes glowPulse{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes beams{0%{opacity:0;transform:rotate(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:rotate(50deg) scale(1.2)}}
#flash{position:fixed;inset:0;z-index:245;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.75),rgba(90,155,255,.25) 35%,transparent 70%)}
#flash.on{animation:flash .55s ease-out}

/* мерцающие звёздочки - фон карточек, как в примере */
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.sparkles i{position:absolute;width:var(--s,9px);height:var(--s,9px);opacity:0;
  background:radial-gradient(circle,#fff 0 18%,transparent 20%),
    conic-gradient(from 45deg,transparent 0 22%,rgba(255,255,255,.95) 25%,transparent 28% 47%,
      rgba(255,255,255,.95) 50%,transparent 53% 72%,rgba(255,255,255,.95) 75%,transparent 78% 97%,
      rgba(255,255,255,.95) 100%);
  -webkit-mask:radial-gradient(circle,#000 0 30%,transparent 72%);mask:radial-gradient(circle,#000 0 30%,transparent 72%);
  animation:twinkle var(--d,3.2s) ease-in-out var(--dl,0s) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}
  50%{opacity:var(--o,.55);transform:scale(1) rotate(45deg)}}

/* ---------- раскладка ---------- */
main{position:relative;z-index:1;padding:calc(10px + var(--tg-content-safe-area-inset-top,0px)) 16px 22px}
.view{display:none}
.view.on{display:block;animation:viewIn .38s var(--ease)}
.view.on.back{animation:viewBack .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateX(18px) scale(.995)}to{opacity:1;transform:none}}
@keyframes viewBack{from{opacity:0;transform:translateX(-18px) scale(.995)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
.top h1{flex:1;margin:0;font-size:33px;font-weight:850;letter-spacing:-1px;line-height:1.08}
.top h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:5px}
.round{width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center;
  color:var(--text);transition:transform .2s var(--spring),background .2s}
.round:active{transform:scale(.9);background:var(--s2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 11px;
  font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sec.big{font-size:24px;font-weight:800;letter-spacing:-.5px;text-transform:none;color:var(--text);margin-top:28px}
.sec a,.sec button{font-size:15px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);
  display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.sec button .ico{width:16px;height:16px}
.lead{margin:-6px 4px 16px;font-size:15px;color:var(--muted);line-height:1.45}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:9px 4px 0;line-height:1.45}

/* ---------- карточки ---------- */
.card{background:var(--s1);border-radius:var(--r-l);padding:16px;margin-bottom:12px;position:relative;
  overflow:hidden}
.card.flat{padding:0}
.group{background:var(--s1);border-radius:var(--r-l);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;
  min-height:56px;position:relative;transition:background .18s}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--sep)}
.group.plain .row+.row::before{left:16px}
button.row:active,.row.tap:active{background:var(--s2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.row .v{font-size:16px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .v.w{color:var(--text)}
.row .chev{width:18px;height:18px;color:var(--muted-2);stroke-width:2.4}
.kv .row{min-height:52px}
.kv .row .k{flex:1;font-size:16px;color:var(--muted)}
.kv .row .v{color:var(--text);font-size:16px}
.kv .row+.row::before{left:16px}

/* цветная плитка-иконка как в настройках iPhone */
.tile{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tile .ico{width:22px;height:22px;stroke-width:2.1}
.tile.blue{background:linear-gradient(160deg,#4a94ff,#1f6cf0)}
.tile.green{background:linear-gradient(160deg,#4be072,#23b84a)}
.tile.orange{background:linear-gradient(160deg,#ffb340,#ff8a00)}
.tile.red{background:linear-gradient(160deg,#ff5f7a,#f0324f)}
.tile.purple{background:linear-gradient(160deg,#c77bff,#9a44f0)}
.tile.indigo{background:linear-gradient(160deg,#7b79ff,#4f4ce0)}
.tile.teal{background:linear-gradient(160deg,#5fd7ec,#1fa9c8)}
.tile.gray{background:linear-gradient(160deg,#7a7a80,#55555a)}
.tile.pink{background:linear-gradient(160deg,#ff6fae,#e83e8c)}
.tile.yellow{background:linear-gradient(160deg,#ffe066,#f5b800)}
.tile.dark{background:#2c2c2e}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;
  border-radius:999px;background:var(--s2);font-size:17px;font-weight:600;
  transition:transform .22s var(--spring),filter .2s,opacity .2s}
.btn:active{transform:scale(.965)}
.btn.blue{background:linear-gradient(180deg,#3f8cff,#2672f0);box-shadow:0 8px 26px rgba(47,124,246,.32)}
.btn.light{background:var(--pill);color:#000}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:rgba(255,69,58,.12);color:var(--red)}
.btn.small{height:40px;font-size:15px;width:auto;padding:0 18px}
.btn:disabled{opacity:.4}
.two{display:flex;gap:10px}
.two>*{flex:1}

/* плавающая кнопка-пилюля над панелью вкладок */
.fab{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--tab-gap) + 14px + env(safe-area-inset-bottom));
  z-index:40;height:52px;padding:0 24px;border-radius:999px;background:var(--pill);color:#000;
  display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.55);transform:translateX(-50%);
  transition:transform .3s var(--spring),opacity .25s}
.fab .ico{stroke-width:2.6;width:20px;height:20px}
.fab.hide{opacity:0;transform:translate(-50%,24px) scale(.9);pointer-events:none}
.fab:active{transform:translateX(-50%) scale(.95)}

/* ---------- стеклянная панель вкладок ---------- */
nav{position:fixed;left:var(--tab-gap);right:var(--tab-gap);
  bottom:calc(var(--tab-gap) + env(safe-area-inset-bottom));z-index:50;height:var(--tab-h);
  border-radius:33px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 5px;
  background:rgba(44,44,48,.68);-webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
nav .ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:28px;
  background:rgba(255,255,255,.13);transition:transform .42s var(--spring),width .42s var(--spring);
  pointer-events:none}
.tab{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:11px;font-weight:600;color:rgba(255,255,255,.62);
  transition:color .25s,transform .25s var(--spring)}
.tab .ico{width:25px;height:25px;stroke-width:2}
.tab.on{color:#fff}
.tab:active{transform:scale(.9)}
.tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;
  place-items:center;border:2px solid rgba(44,44,48,1)}
.tab .me{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--s3);
  display:grid;place-items:center;font-size:12px;font-weight:700}
.tab .me img{width:100%;height:100%;object-fit:cover}

/* ---------- герой-баннеры ---------- */
.hero{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r-xl);
  padding:20px 20px 64px;margin-bottom:12px;min-height:190px;overflow:visible;isolation:isolate;
  transition:transform .3s var(--spring)}
.hero:active{transform:scale(.98)}
.hero .bgc{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1}
.hero .bgc::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 40%)}
.hero h2,.hero p{position:relative;z-index:2}
.hero h2{margin:0;font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.02;max-width:62%;
  text-shadow:0 2px 14px rgba(0,0,0,.25)}
.hero p{margin:8px 0 0;font-size:14.5px;color:rgba(255,255,255,.72);max-width:58%}
.hero .meta{position:absolute;left:20px;bottom:18px;display:flex;gap:7px;flex-wrap:wrap}
.hero .art{position:absolute;right:-6px;top:-24px;width:168px;height:168px;z-index:1;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.45));animation:bob 5s ease-in-out infinite}
.hero.small{min-height:168px;padding:16px 16px 56px}
.hero.small h2{font-size:21px;max-width:100%;letter-spacing:-.4px;text-transform:uppercase;font-weight:900}
.hero.small p{max-width:100%;font-size:13px}
.hero.small .art{width:86px;height:86px;right:-4px;top:auto;bottom:48px}
.hero.small p{max-width:62%}
.hero.small .meta{left:16px;bottom:14px}
.half{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.half .hero{margin:0}
.g-blue{background:linear-gradient(150deg,#3a6df0,#2148b8 60%,#1a3a96)}
.g-amber{background:linear-gradient(150deg,#9a6418,#6b430e 70%)}
.g-teal{background:linear-gradient(150deg,#2a7d8c,#1a525e 70%)}
.g-purple{background:linear-gradient(150deg,#6d4ae0,#432a9e 70%)}
.g-night{background:linear-gradient(160deg,#25262b,#141417)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.silh{position:absolute;inset:0;opacity:.16;pointer-events:none}

/* фишки */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;
  font-size:13.5px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip .ico{width:15px;height:15px;stroke-width:2.3}
.chip.dim{background:var(--s2);color:var(--muted)}
.chip.on{background:rgba(48,209,88,.16);color:#5be37f}
.chip.wait{background:rgba(255,159,10,.16);color:#ffb340}
.chip.off{background:var(--s2);color:var(--muted)}
.chip.blue{background:rgba(47,124,246,.2);color:#8bb8ff}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- изображения подарков ---------- */
.art{position:relative;display:block}
.art>img,.art>.lot,.art>.mono{position:absolute;inset:0;width:100%;height:100%}
.art>img{object-fit:contain;transition:opacity .35s ease}
.art>.lot{opacity:0;transition:opacity .35s ease}
.art.anim>.lot{opacity:1}
.art.anim>img{opacity:0}
.art>.mono{display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a4a52,#232328);color:#c7c7cc;
  font-weight:800;font-size:clamp(11px,30%,34px);letter-spacing:.5px;inset:12%}
.art.wait>img{opacity:0}
.art.wait::after{content:"";position:absolute;inset:18%;border-radius:50%;
  background:linear-gradient(100deg,#202024 30%,#2e2e33 50%,#202024 70%);background-size:220% 100%;
  animation:sk 1.3s linear infinite}

/* карточка подарка на фоне цвета фона (как карточки предметов в примере) */
.gcard{position:relative;border-radius:var(--r-l);overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 38%,var(--c1,#3a4a6a),var(--c2,#1c2333) 72%);
  transition:transform .28s var(--spring)}
.gcard:active{transform:scale(.97)}
.gcard .art{width:72%;aspect-ratio:1;margin:12% auto 0}
.gcard .nm{text-align:center;font-size:15px;font-weight:700;padding:6px 10px 0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.gcard .sb{text-align:center;font-size:12.5px;color:rgba(255,255,255,.6);padding:1px 10px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .pr{display:flex;justify-content:center;margin:9px 0 12px}
.gcard .pr>span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;
  border-radius:16px;background:rgba(0,0,0,.28);font-weight:700;font-size:15px}
.gcard .pr .ico{width:15px;height:15px}
.hscroll{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;
  padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .gcard{flex:0 0 37%;scroll-snap-align:start}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* большая карточка отслеживания (как карточки баттлов в примере) */

.lg-star,.lg-star2{transform-box:fill-box;transform-origin:center;animation:starTw 2.4s ease-in-out infinite}
.lg-star2{animation-delay:-1.1s;animation-duration:1.9s}
@keyframes glare{0%,52%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(190px) skewX(-20deg)}}
@keyframes starTw{0%,100%{transform:scale(.82) rotate(0);opacity:.85}50%{transform:scale(1.14) rotate(25deg);opacity:1}}
#boot .lg-glare{animation-duration:2.2s}
#boot .lg-float{width:100%;height:100%}
#boot.play .lg-float{animation:bob 2.6s ease-in-out 1.2s infinite}
#boot .lg-float svg{width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 14px 30px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(47,140,255,.45))}
@media (prefers-reduced-motion:reduce){.lg-glare,.lg-star,.lg-star2,#boot .lg-float{animation:none!important}}
.skel i{display:block;background:var(--s1);border-radius:12px}
.me-hero{padding-top:6px}
/* Правка надписей: полоса сверху, пока режим включён, и окно правки поверх всего. */
#txbar{position:fixed;left:12px;right:12px;top:calc(10px + var(--tg-content-safe-area-inset-top,0px));z-index:130;
  display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;
  background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 0 0 1px rgba(64,200,224,.45),0 10px 30px rgba(0,0,0,.5);font-size:14px;font-weight:600}
#txbar.on{display:flex;animation:txIn .3s var(--spring)}
#txbar .ico{width:20px;height:20px;flex:0 0 20px;color:var(--teal)}
#txbar span{flex:1;min-width:0;line-height:1.25}
#txbar button{height:34px;padding:0 14px;border:none;border-radius:12px;background:var(--teal);color:#000;
  font-weight:700;font-size:14px}
body.txedit main{padding-top:calc(66px + var(--tg-content-safe-area-inset-top,0px))}
body.txedit .toast{top:calc(68px + var(--tg-content-safe-area-inset-top,0px))}
body.txedit,body.txedit *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#txed{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;
  padding:calc(11vh + var(--tg-content-safe-area-inset-top,0px)) 16px 16px;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#txed.on{display:flex}
#txed *{-webkit-user-select:auto;user-select:auto}
.txcard{width:100%;max-width:420px;background:var(--s1);border-radius:24px;padding:20px 16px 14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);animation:txIn .28s var(--spring)}
.txcard h3{margin:0 4px 12px;font-size:20px;font-weight:800}
.txwas{background:var(--s2);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4;word-break:break-word}
.txwas span{display:block;margin-bottom:3px;font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
#txin{width:100%;margin-top:12px;padding:12px 14px;border:none;border-radius:14px;background:var(--bg);
  color:var(--text);font-size:16px;line-height:1.4;resize:none;box-shadow:0 0 0 2px var(--blue)}
#txin:focus{outline:none}
.txbtns{display:flex;gap:10px;margin-top:10px}
.txcard .btn{height:48px}
.txcard .btn.ghost{height:42px;margin-top:4px}
@keyframes txIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
</style>

<script>
"use strict";
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const P = new URLSearchParams(location.search);
const API_FALLBACK = "";
const API = ((P.get("api") || API_FALLBACK) || "").replace(/\/$/, "");
const DEMO = P.get("demo") === "1";
/* Режим для скриншотов (?shots=1): в скрытом окне браузер не даёт кадров анимации,
   и частицы с анимациями подарков замирают. Подменяем на обычный таймер.
   window.SHOTS_PAUSE = true останавливает частицы, чтобы снять нужный миг. */
if(P.get("shots") === "1"){
  window.SHOTS_PAUSE = false;
  window.requestAnimationFrame = (cb) => {
    const tick = () => (window.SHOTS_PAUSE ? setTimeout(tick, 50) : cb(performance.now()));
    return setTimeout(tick, 16);
  };
  window.cancelAnimationFrame = (id) => clearTimeout(id);
}
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const ic = (n, c) => `<svg class="ico ${c || ""}"><use href="#i-${n}"/></svg>`;
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
function haptic(k){ try{ TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred(k || "light"); }catch(e){} }
function hapticOk(){ try{ TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred("success"); }catch(e){} }

/* Тактильный отклик на любое нажатие - один обработчик на весь документ: кнопок
   десятки, и о новых легко забыть. */
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("button, .tap");
  if(!el || el.disabled) return;
  haptic(el.classList.contains("blue") || el.classList.contains("fab") ? "medium" : "light");
}, { passive: true });

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}
const nColl = (n) => `${n} ${plural(n, "коллекция", "коллекции", "коллекций")}`;
const nSlot = (n) => `${n} ${plural(n, "слот", "слота", "слотов")}`;

let S = null, VIEW = "home", CATALOG = {}, COLLS = null;

/* ===================== ЛОГОТИП =====================
   GiftFlip: синий подарок на тёмном фоне и белая четырёхконечная искра (в духе
   логотипа Gram). По подарку пробегает блик, искра мерцает (.lg-glare, .lg-star).
   У каждой копии свои id градиентов: логотип стоит на странице в нескольких местах,
   и копия в скрытом экране иначе «утаскивала» бы градиенты у видимой. */
const SQ = "M60 3C17 3 3 17 3 60s14 57 57 57 57-14 57-57S103 3 60 3z";
function starPath(cx, cy, r){
  const k = r * .2;
  return `M${cx} ${cy - r}C${cx + k} ${cy - k} ${cx + k} ${cy - k} ${cx + r} ${cy}` +
    `C${cx + k} ${cy + k} ${cx + k} ${cy + k} ${cx} ${cy + r}` +
    `C${cx - k} ${cy + k} ${cx - k} ${cy + k} ${cx - r} ${cy}` +
    `C${cx - k} ${cy - k} ${cx - k} ${cy - k} ${cx} ${cy - r}z`;
}

/* ===================== ЭФФЕКТЫ =====================
   Владелец включает и выключает их в админке по местам: загрузка, покупка слота,
   добавление, открытие карточки. Экран загрузки показывается ДО ответа бота, поэтому

const FX_KEYS = ["boot", "buy", "add", "open"];
let EFX = { boot: true, buy: true, add: true, open: true };
try{ Object.assign(EFX, JSON.parse(localStorage.getItem("gs_fx") || "{}")); }catch(e){}

function applyEffects(e){
  if(!e) return;

/* Звёздочки на фоне карточек - как в примере: мерцают вразнобой. */
function sparkles(n, o){
  let h = "";
  for(let i = 0; i < (n || 7); i++){
    const s = 6 + Math.random() * 9, x = Math.random() * 96, y = Math.random() * 92;
    h += `<i style="left:${x}%;top:${y}%;--s:${s.toFixed(1)}px;--d:${(2.4 + Math.random() * 2.6).toFixed(2)}s;` +
         `--dl:${(-Math.random() * 4).toFixed(2)}s;--o:${(o || .55) * (.6 + Math.random() * .4)}"></i>`;
  }
  return `<div class="sparkles">${h}</div>`;
}

const FX = (() => {
  const cv = $("fx"), ctx = cv.getContext("2d");
  let parts = [], raf = 0, dpr = 1;
  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    // присвоение размера стирает холст: без изменения размера искры не трогаем
    if(cv.width === w && cv.height === h) return;
    cv.width = w; cv.height = h;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  }
  size(); addEventListener("resize", size);
  const COLORS = ["#ffffff", "#cfe1ff", "#8fbcff", "#5a9bff", "#2f7cf6", "#ffe68a"];
  function star(x, y, r, rot){
    ctx.beginPath();
    for(let i = 0; i < 8; i++){
      const a = rot + i * Math.PI / 4, rr = i % 2 ? r * .32 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }
  function loop(){
    try{ draw(); }
    catch(e){ console.warn("частицы:", e); parts = []; }   // сбой не должен оставлять искры на экране
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if(!raf) ctx.clearRect(0, 0, cv.width, cv.height);
  }
  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = "lighter";
    parts = parts.filter((p) => p.life > 1);
    for(const p of parts){
      p.life--; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.rot += p.vr;
      const k = p.life / p.max;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.fillStyle = p.c;
      if(p.kind === "conf"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); ctx.restore();
      } else if(p.kind === "px"){
        const z = Math.max(.5, p.r * (.45 + k * .75));
        ctx.fillRect(p.x - z / 2, p.y - z / 2, z, z);
      } else if(p.kind === "star"){
        star(p.x, p.y, Math.max(.1, p.r * (.6 + k * .6)), p.rot);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.1, p.r * k), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function add(list){ parts.push(...list); if(!raf) raf = requestAnimationFrame(loop); }
  function burst(x, y, o){
    o = o || {};
    const n = o.n || 70, out = [];
    for(let i = 0; i < n; i++){
      const a = (o.angle ?? 0) + (Math.random() - .5) * (o.spread ?? Math.PI * 2);
      const sp = (o.speed || 8) * (.35 + Math.random() * .8);
      const life = (o.life || 60) * (.6 + Math.random() * .6);
      // ring: искры стартуют с кольца вокруг точки, а не из центра - иначе в центре
      // «белое пятно», и того, что взорвалось, не видно
      const rr = o.ring ? o.ring * (.75 + Math.random() * .35) : 0;
      out.push({ x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.gravity ?? .12,
        drag: o.drag ?? .965, r: (o.size || 6) * (.45 + Math.random() * .9), rot: Math.random() * 6,
        vr: (Math.random() - .5) * .25, life, max: life,
        c: (o.colors || COLORS)[i % (o.colors || COLORS).length],
        kind: o.kind || (o.kinds ? o.kinds[i % o.kinds.length] : Math.random() < .55 ? "star" : "dot") });
    }
    add(out);
  }
  function confetti(){
    const cols = ["#5a9bff", "#ffffff", "#2f7cf6", "#ffd60a", "#bf5af2", "#63e6be"];
    burst(innerWidth * .2, -10, { n: 60, angle: Math.PI * .4, spread: 1.1, speed: 11, gravity: .22,
      life: 120, size: 6, colors: cols, kind: "conf", drag: .985 });
    burst(innerWidth * .8, -10, { n: 60, angle: Math.PI * .6, spread: 1.1, speed: 11, gravity: .22,
      life: 120, size: 6, colors: cols, kind: "conf", drag: .985 });
  }
  function flash(x, y){
    const f = $("flash");
    f.style.setProperty("--fx", x + "px"); f.style.setProperty("--fy", y + "px");
    f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  }
  /* «Вылет»: копия картинки поверх всего вырастает за края карточки (pop) или
     летит на человека сквозь экран (out). Свечение, лучи, искры и вспышка. */
  function fly(src, mode){
    if(!src) return Promise.resolve();
    const r = src.getBoundingClientRect();
    if(!r.width) return Promise.resolve();
    const el = document.createElement("div");
    el.className = "fly";
    Object.assign(el.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    el.innerHTML = `<div class="beams"></div><div class="glow"></div>`;
    // В полёт отправляем картинку PNG, а не копию анимации: анимация ссылается на
    // маски оригинала, а он на время эффекта скрыт - копия вышла бы пустой.
    const png = src.querySelector(":scope > img");
    let copy;
    if(png && png.complete && png.naturalWidth){
      copy = new Image(); copy.src = png.src; copy.alt = "";
      copy.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain";
    } else {
      copy = src.cloneNode(true);
      copy.style.cssText = "position:absolute;inset:0;width:100%;height:100%;margin:0;transform:none;animation:none";
    }
    el.appendChild(copy);
    document.body.appendChild(el);
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // Прячем прозрачностью, а не visibility: копия ссылается на градиенты и маски
    // оригинала, и при visibility:hidden они перестают рисоваться.
    const vis = src.style.opacity;
    src.style.opacity = "0";
    let frames, ms;
    if(mode === "out"){
      const dx = innerWidth / 2 - cx, dy = innerHeight * .42 - cy;
      // Плавность - у каждого отрезка своя: разгон к центру, зависание, бросок на
      // человека. Общая на весь полёт съела бы самую эффектную часть.
      frames = [
        { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1, filter: "brightness(1)",
          easing: "cubic-bezier(.2,.9,.3,1)" },
        { transform: `translate(${dx * .7}px,${dy * .7}px) scale(1.8) rotate(-8deg)`, opacity: 1,
          filter: "brightness(1.25)", offset: .38, easing: "ease-in-out" },
        { transform: `translate(${dx}px,${dy}px) scale(2.3) rotate(4deg)`, opacity: 1,
          filter: "brightness(1.35)", offset: .62, easing: "cubic-bezier(.6,0,.9,.45)" },
        { transform: `translate(${dx}px,${dy}px) scale(7) rotate(12deg)`, opacity: 0,
          filter: "brightness(2) blur(4px)" }];
      ms = 1150;
      setTimeout(() => { flash(innerWidth / 2, innerHeight * .42);
        burst(innerWidth / 2, innerHeight * .42, { n: 110, speed: 13, size: 8, life: 75 }); }, ms * .6);
    } else {
      frames = [
        { transform: "scale(1) translateY(0) rotate(0)", filter: "brightness(1)", easing: "cubic-bezier(.2,.9,.3,1.2)" },
        { transform: "scale(1.75) translateY(-14%) rotate(-7deg)", filter: "brightness(1.3)", offset: .38, easing: "ease-in-out" },
        { transform: "scale(1.55) translateY(-10%) rotate(3deg)", filter: "brightness(1.15)", offset: .6,
          easing: "cubic-bezier(.3,1.4,.5,1)" },
        { transform: "scale(1) translateY(0) rotate(0)", filter: "brightness(1)" }];
      ms = 950;
      setTimeout(() => burst(cx, cy - r.height * .1, { n: 55, speed: 7.5, size: 6.5, life: 55 }), ms * .32);
    }
    const anim = el.animate(frames, { duration: ms, easing: "linear", fill: "forwards" });
    return new Promise((ok) => {
      let done = false;
      const end = () => { if(done) return; done = true; src.style.opacity = vis; el.remove(); ok(); };
      anim.onfinish = end;
      // Страховка: если анимацию прервали (свернули Telegram), подарок не должен
      // остаться невидимым.
      setTimeout(end, ms + 600);
    });
  }
  return { burst, confetti, flash, fly };
})();

/* ===================== АНИМАЦИИ ПОДАРКОВ =====================
   Источник - открытый каталог подарков (cdn.changes.tg): модели по названию
   коллекции и модели, оригиналы коллекций по номеру подарка, цвета фонов.
   Порядок показа такой: сразу картинка PNG, поверх - анимация, когда она загрузится
   и карточка на экране. Не загрузилась анимация - остаётся картинка; не нашлась и
   картинка - кружок с буквами. Так «проигрыватель не сработал» больше никогда не
   выглядит как пустое место, а «нет картинки» не похоже на «ещё грузится». */
const CDN = "https://cdn.changes.tg/gifts";
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const ART = { ready: null, names: new Map(), bd: new Map(), json: new Map(), live: new Set() };
function artIndex(){
  if(ART.ready) return ART.ready;
  const get = (u, d) => fetch(u).then((r) => r.ok ? r.json() : d).catch(() => d);
  ART.ready = Promise.all([get(CDN + "/id-to-name.json", {}), get(CDN + "/backdrops.json", [])])
    .then(([ids, bds]) => {
      Object.entries(ids || {}).forEach(([id, name]) => ART.names.set(norm(name), { id, name }));
      (bds || []).forEach((b) => b && b.name && ART.bd.set(b.name.toLowerCase(), b.hex || {}));
    });
  return ART.ready;
}
function collName(s){ const e = ART.names.get(norm(s)); return e ? e.name : String(s || ""); }
function bdHex(name){
  const h = ART.bd.get(String(name || "").toLowerCase());
  return h ? { c1: h.centerColor, c2: h.edgeColor } : null;
}
function bdVars(name, fallback){
  const h = bdHex(name) || fallback || { c1: "#3b4a6b", c2: "#1a2132" };
  return `--c1:${h.c1};--c2:${h.c2}`;
}
function initials(s){
  const w = String(s || "?").replace(/[^A-Za-zА-Яа-я0-9 ]/g, " ").trim().split(/\s+/);
  return ((w[0] || "?")[0] + ((w[1] || "")[0] || "")).toUpperCase();
}
/* Разметка-заготовка: настоящая картинка подставляется после отрисовки. */
function art(coll, model, cls, anim){
  return `<div class="art ${cls || ""}" data-ac="${esc(coll || "")}" data-am="${esc(model || "")}"
    data-aa="${anim ? 1 : ""}"></div>`;
}
const ioArt = "IntersectionObserver" in window ? new IntersectionObserver((list) => {
  list.forEach((en) => {
    const el = en.target;
    if(en.isIntersecting) playArt(el); else if(el._anim){ el._anim.pause(); ART.live.delete(el); }
  });
}, { rootMargin: "60px" }) : null;

function hydrateArt(root){
  const els = (root || document).querySelectorAll(".art[data-ac]:not([data-ah])");
  if(!els.length) return;
  artIndex().then(() => els.forEach(setupArt));
}
function artUrls(coll, model){
  const name = collName(coll);
  const out = [];
  if(model) out.push({ png: `${CDN}/models/${encodeURIComponent(name)}/png/${encodeURIComponent(model)}.png`,
                       json: `${CDN}/models/${encodeURIComponent(name)}/lottie/${encodeURIComponent(model)}.json` });
  const e = ART.names.get(norm(coll));
  if(e) out.push({ png: `${CDN}/originals/${e.id}/Original.png`, json: `${CDN}/originals/${e.id}/Original.json` });
  return out;
}
function setupArt(el){
  if(el.dataset.ah) return;
  el.dataset.ah = "1";
  const urls = artUrls(el.dataset.ac, el.dataset.am);
  const mono = () => { el.classList.remove("wait"); el.innerHTML = `<div class="mono">${esc(initials(el.dataset.am || collName(el.dataset.ac)))}</div>`; };
  if(!urls.length){ mono(); return; }
  el.classList.add("wait");
  let i = 0;
  const img = new Image();
  // Отложенная загрузка: в списке выбора до сотни коллекций по ~250 КБ, и качать
  // их все сразу на телефоне незачем: браузер берёт только те, что у экрана.
  img.decoding = "async"; img.alt = ""; img.loading = "lazy";
  img.onload = () => { el.classList.remove("wait"); el._json = urls[i].json;
    if(el.dataset.aa && ioArt) ioArt.observe(el); };
  img.onerror = () => { i++; if(i < urls.length) img.src = urls[i].png; else mono(); };
  el.appendChild(img);
  img.src = urls[0].png;
}
function getJson(u){
  if(!ART.json.has(u)) ART.json.set(u, fetch(u).then((r) => r.ok ? r.json() : null).catch(() => null));
  return ART.json.get(u);
}
async function playArt(el){
  if(!el._json || !window.lottie || !document.body.contains(el)) return;
  if(el._anim){ el._anim.play(); ART.live.add(el); return; }
  if(el._loading) return;
  el._loading = true;
  const data = await getJson(el._json);
  el._loading = false;
  if(!data || !document.body.contains(el)) return;
  const box = document.createElement("div");
  box.className = "lot";
  el.appendChild(box);
  try{
    // Проигрыватель меняет данные на месте - каждой анимации своя копия.
    const copy = typeof structuredClone === "function" ? structuredClone(data) : JSON.parse(JSON.stringify(data));
    el._anim = window.lottie.loadAnimation({ container: box, renderer: "svg", loop: true, autoplay: true,
      animationData: copy, rendererSettings: { preserveAspectRatio: "xMidYMid meet", progressiveLoad: true } });
    // Картинку прячем только после ПЕРВОГО НАРИСОВАННОГО кадра, а не когда
    // проигрыватель «загрузился»: иначе любой его сбой давал бы пустое место.
    const shown = () => { el.classList.add("anim"); el._anim.removeEventListener("enterFrame", shown); };
    el._anim.addEventListener("enterFrame", shown);
    el._anim.addEventListener("data_failed", () => { box.remove(); el._anim = null; });
    ART.live.add(el);
    // Одновременно играет ограниченное число: телефону тяжело больше.
    if(ART.live.size > 10){
      const old = [...ART.live].find((x) => x !== el && !x.closest(".shero"));
      if(old && old._anim){ old._anim.pause(); ART.live.delete(old); }
    }
  }catch(e){ box.remove(); console.warn("анимация подарка не запустилась", e); }
}

/* ===================== СООБЩЕНИЯ ===================== */
let tt = null;
function toast(text, icon){
  const el = $("toast");
  el.innerHTML = ic(icon || "check") + "<span>" + esc(text) + "</span>";
  el.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2300);
}

/* ===================== СВЯЗЬ ===================== */
async function call(action, payload){
  if(DEMO){
    // демо отвечает тем же видом, что и бот: новое состояние применяем так же
    const d = await demoCall(action, payload);
    if(d && d.state) setState(d.state);
    return d;
  }
  const res = await fetch(`${API}/api/${action}`, {
    method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" },
    body: JSON.stringify({ initData: TG ? TG.initData : "", payload: payload || {} })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){ data = null; }
  if(!res.ok) throw new Error((data && data.error) || `ошибка ${res.status}`);
  if(data && data.state) setState(data.state);
  return data;
}
function setState(st){
  S = st;
  if(!S) return;
  if(S.effects) applyEffects(S.effects);
  if(S.texts) setTexts(S.texts);
  txEditMode(TXEDIT);
}
async function save(action, payload, msg){
  try{ await call(action, payload); render(); toast(msg || "Сохранено"); return true; }
  catch(e){ toast(e.message, "help"); return false; }
}

/* Тихое обновление: подписка в Gift Satellite создаётся не мгновенно, и статус
   «создаётся» иначе менялся бы только после перезагрузки. */
let refreshTimer = null;
async function refreshState(){
  if(document.hidden || !S) return;
  try{
    const d = await call("state", {});
    const next = d.uid ? d : (d.state || null);
    if(!next) return;
    const was = JSON.stringify(S);
    setState(next);
    if(was !== JSON.stringify(S) && !$("sheet").classList.contains("on")) render();
  }catch(e){ /* нет связи - попробуем в следующий раз */ }
}
function startRefresh(){
  if(refreshTimer) return;
  refreshTimer = setInterval(refreshState, 15000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshState(); });
}

const ORDER = ["home", "sniper", "flip", "portfolio", "profile"];
function moveInd(){

  const ind = $("ind");
  if(!tab || !ind) return;
  ind.style.width = tab.offsetWidth + "px";
  ind.style.transform = `translateX(${tab.offsetLeft - 5}px)`;
}
function go(view){
  const prev = VIEW;
  const changed = prev !== view;
  VIEW = view;
  const back = ORDER.indexOf(view) < ORDER.indexOf(prev) && ORDER.includes(view);
  document.querySelectorAll("main .view").forEach((v) => {
    const on = v.id === "v-" + view;
    v.classList.toggle("on", on);
    v.classList.toggle("back", on && back);
  });
  const navKey = ORDER.includes(view) ? view : "profile";
  document.querySelectorAll("nav .tab").forEach((t) => t.classList.toggle("on", t.dataset.go === navKey));
  moveInd();
  if(changed) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  render();
  if(changed){
    const el = $("v-" + view);
    el.classList.add("fresh");
    setTimeout(() => el.classList.remove("fresh"), 800);
  }
  if(TG && TG.BackButton){
    if(!ORDER.includes(view)) TG.BackButton.show(); else if(!$("sheet").classList.contains("on")) TG.BackButton.hide();
  }
}
function fab(text, fn){
  const f = $("fab");
  if(!text){ f.classList.add("hide"); f.onclick = null; return; }
  $("fab-t").textContent = text;
  f.classList.remove("hide");
  f.onclick = () => { haptic("medium"); fn(); };
}

/* ===================== ОБЩЕЕ ДЛЯ ЭКРАНОВ ===================== */
function fline(models, backdrops){
  const m = models.length ? models.slice(0, 2).join(", ") + (models.length > 2 ? ` +${models.length - 2}` : "")
                          : "любая модель";
  const b = backdrops.length ? backdrops.slice(0, 2).join(", ") + (backdrops.length > 2 ? ` +${backdrops.length - 2}` : "")
                             : "любой фон";
  return `${esc(m)} · ${esc(b)}`;
}
function numLabel(v){
  if(!v) return "";
  if(String(v).startsWith("p:")) return String(v).slice(2).toUpperCase();
  const p = String(v).split(":");
  return (p[0] === "" ? "любая" : p[0]) + "×" + p[1] + (p[2] === "1" ? " подряд" : "");
}
/* Подписка в Gift Satellite создаётся не мгновенно, и молчание в этот момент
   выглядит как поломка - показываем «создаётся». */
function statusChip(x){
  if(x.paused) return `<span class="chip wait">не хватает слотов</span>`;
  if(!x.enabled) return `<span class="chip off">${ic("power")}выключено</span>`;
  if(x.pending) return `<span class="chip wait"><i class="dot"></i>создаётся</span>`;
  return `<span class="chip on"><i class="dot"></i>активно</span>`;
}
function fmtTon(v){
  const n = Number(v || 0);
  return n >= 1000 ? Math.round(n).toLocaleString("ru-RU") : n >= 100 ? n.toFixed(0) : n.toFixed(2);
}
function deltaHtml(pct){
  const up = Number(pct) >= 0;
  return `<span class="delta ${up ? "up" : "down"}">${ic(up ? "up" : "down")}${up ? "+" : ""}${
    Number(pct || 0).toFixed(2)}%</span>`;
}
function countTo(el, to, from){
  if(!el) return;
  const start = Number(from ?? 0), end = Number(to || 0);
  if(!isFinite(start) || Math.abs(end - start) < 0.01) return;
  const t0 = performance.now(), ms = 650;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms);
    el.textContent = fmtTon(start + (end - start) * (1 - Math.pow(1 - k, 3)));
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* Сегментированный переключатель с бегунком, как в iOS. */
function segHtml(id, items, value){
  return `<div class="seg" id="${id}"><span class="thumb"></span>${items.map(([k, t]) =>
    `<button data-k="${esc(k)}" class="${String(k) === String(value) ? "on" : ""}">${esc(t)}</button>`).join("")}</div>`;
}
function bindSeg(id, onPick){
  const box = $(id);
  if(!box) return;
  const thumb = box.querySelector(".thumb");
  const place = () => {
    const on = box.querySelector("button.on") || box.querySelector("button");
    if(!on || !thumb) return;
    thumb.style.width = on.offsetWidth + "px";
    thumb.style.transform = `translateX(${on.offsetLeft - 2}px)`;
  };
  place(); requestAnimationFrame(place);
  box.querySelectorAll("button").forEach((b) => b.onclick = () => {
    box.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); place(); haptic();
    if(onPick) onPick(b.dataset.k);
  });
}
function rowHtml(o){
  return `<button class="row" ${o.attr || ""}>

function bindStepper(id, onSave){
  const box = $(id);

  let t = null;
  box.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => {
    const v = Math.min(Number(box.dataset.hi), Math.max(Number(box.dataset.lo),
      Number(box.dataset.v) + Number(b.dataset.d)));
    box.dataset.v = v;
    box.querySelector("b").textContent = v + box.dataset.suf;
    // Сохраняем, когда человек перестал нажимать: иначе запрос на каждое нажатие.

  });

/* Покупка слота прямо в приложении: счёт открывает Telegram, после оплаты
   состояние перечитываем, иначе слот «появится» только после перезахода. */
async function buySlot(){
  haptic("medium");
  try{
    const r = await call("slot_invoice", {});
    if(!TG || !TG.openInvoice){
      if(DEMO){ celebrateSlot(); return; }
      toast("Оплата доступна только внутри Telegram", "card"); return;
    }
    TG.openInvoice(r.link, async (status) => {
      if(status === "paid"){
        celebrateSlot();
        // Telegram сообщает об оплате чуть раньше, чем бот начислит слот.
        const before = S.flip.slots_total;
        for(let i = 0; i < 6; i++){
          const d = await call("state", {});
          setState(d.uid ? d : (d.state || S));
          render();
          if(S.flip.slots_total !== before) break;
          await sleep(700);
        }
      } else if(status === "failed") toast("Оплата не прошла", "card");
    });
  }catch(e){ toast(e.message, "card"); }
}
function celebrateSlot(){
  hapticOk();
  toast("Слот добавлен", "ticket");
  if(!fxOn("buy")) return;
  FX.fly($("flip-ticket"), "out");
  setTimeout(FX.confetti, 500);
}

   Стоимость считает бот раз в час, в начале часа и одинаково для всех. Добавление
   подарка не рисует ступеньку: портфель не подорожал, в него положили ещё один
   подарок. «За 24 часа» - от того же часа вчера. */
function chartSvg(points, marks){
  if(!points || points.length < 2) return "";
  const W = 340, H = 150, pad = 8;
  const xs = points.map((p) => p.t), ys = points.map((p) => p.v);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = (maxX - minX) || 1;
  const padY = ((maxY - minY) || 1) * .18;
  const lo = minY - padY, hi = maxY + padY;
  const px = (t) => pad + ((t - minX) / spanX) * (W - pad * 2);
  const py = (v) => H - pad - ((v - lo) / ((hi - lo) || 1)) * (H - pad * 2);
  const line = points.map((p, i) => `${i ? "L" : "M"}${px(p.t).toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");
  const area = `${line} L${px(maxX).toFixed(1)},${H} L${px(minX).toFixed(1)},${H} Z`;
  const up = points[points.length - 1].v >= points[0].v;
  const col = up ? "#30d158" : "#ff453a";
  const dots = (marks || []).map((m) => {
    const near = points.reduce((a, b) => Math.abs(b.t - m.t) < Math.abs(a.t - m.t) ? b : a);
    return `<circle class="mark" cx="${px(near.t).toFixed(1)}" cy="${py(near.v).toFixed(1)}" r="5"><title>${
      esc(m.title || "добавлен подарок")}</title></circle>`;
  }).join("");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#pg)"/>
    <path class="cline" d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"
      stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${dots}<circle cx="${px(last.t).toFixed(1)}" cy="${py(last.v).toFixed(1)}" r="4.5" fill="#fff"/></svg>`;
}
let portRange = "24h", portShown = null;
const RANGES = { "24h": 24 * 3600e3, "week": 7 * 86400e3, "month": 30 * 86400e3 };
const RANGE_NAMES = { "24h": "24 часа", "week": "Неделя", "month": "Месяц" };
function cutRange(points, key){
  const span = RANGES[key];
  if(!points || !points.length || !span) return points || [];
  const last = points[points.length - 1].t;
  const cut = points.filter((p) => p.t >= last - span);
  return cut.length >= 2 ? cut : points;
}
function bindCrosshair(box, points){
  if(!box) return;
  const cross = box.querySelector(".cross"), svg = box.querySelector("svg");
  if(!cross || !svg || !points.length) return;
  const minX = points[0].t, maxX = points[points.length - 1].t;
  const ys = points.map((p) => p.v);
  const lo = Math.min(...ys), hi = Math.max(...ys), padY = ((hi - lo) || 1) * .18;
  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const x = Math.min(Math.max(clientX - r.left, 0), r.width);
    const t = minX + (x / (r.width || 1)) * ((maxX - minX) || 1);
    const p = points.reduce((a, b) => Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a);
    const px = ((p.t - minX) / ((maxX - minX) || 1)) * r.width;
    const py = r.height - ((p.v - (lo - padY)) / (((hi + padY) - (lo - padY)) || 1)) * r.height;
    cross.querySelector(".vline").style.left = px + "px";
    const dot = cross.querySelector(".dot");
    dot.style.left = px + "px"; dot.style.top = py + "px";
    const tip = cross.querySelector(".tip");
    tip.innerHTML = `<small>${esc(new Date(p.t).toLocaleString("ru-RU",
      { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small><b>${ic("ton")}${fmtTon(p.v)}</b>`;
    tip.style.left = Math.min(Math.max(px, 60), r.width - 60) + "px";
    tip.style.top = Math.max(py, 44) + "px";
    if(!cross.classList.contains("on")) haptic();
    cross.classList.add("on");
  };
  const hide = () => cross.classList.remove("on");
  svg.style.touchAction = "none";
  svg.addEventListener("pointerdown", (e) => { svg.setPointerCapture(e.pointerId); show(e.clientX); });
  svg.addEventListener("pointermove", (e) => { if(cross.classList.contains("on")) show(e.clientX); });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => svg.addEventListener(ev, hide));
}

/* ---------- поиск с бегущей подсказкой ---------- */
function runPlaceholder(el, samples){
  let i = 0, pos = 0, del = false;
  const tick = () => {
    if(!document.body.contains(el)) return;
    if(el.dataset.busy === "1"){ el.__t = setTimeout(tick, 300); return; }
    const word = samples[i % samples.length] || "";
    pos += del ? -1 : 1;
    el.innerHTML = esc(word.slice(0, pos)) + "<i></i>";
    let wait = del ? 40 : 80;
    if(!del && pos >= word.length){ del = true; wait = 1200; }
    else if(del && pos <= 0){ del = false; i++; wait = 320; }
    el.__t = setTimeout(tick, wait);
  };
  if(samples && samples.length) tick();
  return () => clearTimeout(el.__t);
}
function searchField(id){
  return `<div class="search">${ic("search")}<input type="text" id="${id}" autocomplete="off">
    <div class="ph" id="${id}-ph"></div></div>`;
}
function bindSearch(id, samples, onInput){
  const inp = $(id), ph = $(id + "-ph");
  const stop = runPlaceholder(ph, samples);
  inp.oninput = () => {
    const typing = !!inp.value;
    ph.dataset.busy = typing ? "1" : "0";
    ph.style.display = typing ? "none" : "block";
    onInput(inp.value.trim());
  };
  return stop;
}

/* ---------- сетка выбора с картинками ----------
   Ручного ввода нет: значение должно совпадать с тем, что знает Telegram, а
   опечатка давала бы фильтр, который молчит. */
function pickGrid(id, items, selected, kind, coll, single){
  const set = new Set(selected || []);
  const draw = (filter) => {
    const q = (filter || "").toLowerCase();
    const list = items.filter((x) => !q || String(x.name).toLowerCase().includes(q)).slice(0, 120);
    const box = $(id);
    box.innerHTML = list.length ? list.map((x) => `
      <button class="opt ${set.has(x.name) ? "on" : ""}" data-v="${esc(x.name)}">
        ${kind === "bd" ? `<span class="swatch" style="background:radial-gradient(circle at 50% 40%,${
            (bdHex(x.name) || {}).c1 || x.color || "#555"},${(bdHex(x.name) || {}).c2 || "#222"})"></span>`
          : kind === "mk" ? marketIcon(x.key)
          : art(coll, x.name)}
        <span>${esc(x.name)}</span>
        ${x.pct ? `<span class="pct">${esc(x.pct)}%</span>` : ""}
      </button>`).join("") : `<div class="hint" style="grid-column:1/-1">Ничего не нашлось</div>`;
    box.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
      const v = b.dataset.v;
      if(single && !set.has(v)){ set.clear(); box.querySelectorAll(".opt.on").forEach((x) => x.classList.remove("on")); }
      if(set.has(v)) set.delete(v); else set.add(v);
      b.classList.toggle("on", set.has(v)); haptic();
      box.dispatchEvent(new Event("pick"));
    });
    after(box);
  };
  return { html: `<div class="grid ${kind === "mk" ? "mk" : ""}" id="${id}"></div>`, draw, value: () => [...set] };
}
/* Сводка в строке, сетка раскрывается по нажатию: у коллекции полсотни моделей, и
   без этого всё остальное уезжало бы далеко вниз. */
function drawerPick(id, title, items, selected, kind, coll, samples){
  const pick = pickGrid(id, items, selected, kind, coll);
  const summary = () => {
    const v = pick.value();
    if(!v.length) return kind === "bd" ? "любой фон" : "любая модель";
    return v.slice(0, 3).join(", ") + (v.length > 3 ? ` и ещё ${v.length - 3}` : "");
  };
  const peek = () => kind === "bd" ? "" : pick.value().slice(0, 3).map((m) => art(coll, m)).join("");
  return {
    html: `<div class="drawer" id="${id}-dr">
      <button class="drawer-head" id="${id}-head">
        <span class="tile ${kind === "bd" ? "purple" : "blue"}">${ic(kind === "bd" ? "mono" : "gift")}</span>
        <span class="t"><b>${esc(title)}</b><span id="${id}-sum">${esc(summary())}</span></span>
        <span class="peek" id="${id}-pk">${peek()}</span>
        <span class="count" id="${id}-cnt" style="${selected.length ? "" : "display:none"}">${selected.length}</span>
        <svg class="ico arr"><use href="#i-chevd"/></svg></button>
      <div class="drawer-body"><div><div class="in">${searchField(id + "-s")}${pick.html}</div></div></div>
    </div>`,
    bind(){
      pick.draw("");
      const stop = bindSearch(id + "-s", samples || [], pick.draw);
      const dr = $(id + "-dr");
      const refresh = () => {
        $(id + "-sum").textContent = summary();
        const n = pick.value().length;
        $(id + "-cnt").textContent = n;
        $(id + "-cnt").style.display = n ? "" : "none";
        $(id + "-pk").innerHTML = peek(); after($(id + "-pk"));
      };
      $(id + "-head").onclick = () => { dr.classList.toggle("on"); haptic(); if(!dr.classList.contains("on")) refresh(); };
      $(id).addEventListener("pick", refresh);
      return stop;
    },
    value: pick.value,
  };
}

        <div class="scale"><span>50%</span><span>90%</span></div>
        <div class="hint" style="margin:8px 0 0">Придёт, если модель сочетается с фоном не хуже выбранного.</div>
      </div></div>`;
}
function bindMonoRow(){
  const range = $("mono-range");
  let on = $("mono-on").classList.contains("on");
  const paint = () => {
    const pct = ((range.value - range.min) / (range.max - range.min)) * 100;
    range.style.setProperty("--track", `linear-gradient(90deg,var(--blue) ${pct}%,#3a3a3c ${pct}%)`);
    $("mv").innerHTML = range.value + "<small>%+</small>";
  };
  let last = 0;
  range.oninput = () => { paint(); if(Date.now() - last > 60){ haptic(); last = Date.now(); } };
  paint();
  $("mono-on").onclick = () => {
    on = !on; $("mono-on").classList.toggle("on");
    $("mono-body").style.display = on ? "block" : "none"; haptic();
  };
  return () => (on ? Number(range.value) : 0);
}

/* ---------- красивый номер ---------- */
function numberBlock(value){
  const isPat = String(value || "").startsWith("p:");
  const p = String(value || "").split(":");
  const on = !!value;
  const digits = (!isPat && p[0]) ? p[0].split("") : [];
  return `<div class="group plain" style="margin-top:9px"><div class="row">
      <span class="tile orange">${ic("hash")}</span>
      <span class="t"><b>Красивый номер</b><span>ловить подарки с особыми номерами</span></span>
      <button class="tgl ${on ? "on" : ""}" id="n-on"></button></div></div>
    <div id="n-body" style="display:${on ? "block" : "none"}">
      <div style="margin-top:10px">${segHtml("nk", [["repeat", "Повторы"], ["pattern", "Шаблон"]], isPat ? "pattern" : "repeat")}</div>
      <div id="nrep" style="display:${isPat ? "none" : "block"}">
        <label>Цифры - можно несколько</label>
        <div class="digits">${"0123456789".split("").map((d) =>
          `<button data-d="${d}" class="${digits.includes(d) ? "on" : ""}">${d}</button>`).join("")}</div>
        <label>Сколько раз повторяется</label>
        ${segHtml("ncnt", [2, 3, 4, 5, 6].map((n) => [n, "×" + n]), p[1] || 3)}
        <div class="group plain" style="margin-top:10px"><div class="row"><span class="t"><b>Подряд</b>
          <span>7777 подойдёт, 7177 нет</span></span>
          <button class="tgl ${p[2] === "1" ? "on" : ""}" id="nrow"></button></div></div>
      </div>
      <div id="npat" style="display:${isPat ? "block" : "none"}">
        <label>Свой шаблон</label>
        <input type="text" id="npattern" placeholder="AAA, ABAB" value="${isPat ? esc(String(value).slice(2)) : ""}">
        <div class="hint">Разные буквы - разные цифры. Длина шаблона равна длине номера.</div>
      </div>
      <div class="numex"><div class="y"><small>подойдёт</small><b id="nex-y">-</b></div>
        <div class="n"><small>не подойдёт</small><b id="nex-n">-</b></div></div>
    </div>`;
}
function bindNumber(){
  let on = $("n-on").classList.contains("on");
  let kind = $("nk").querySelector("button.on").dataset.k;
  let row = $("nrow").classList.contains("on");
  const digits = new Set([...document.querySelectorAll("[data-d].on")].map((b) => b.dataset.d));
  let cnt = Number($("ncnt").querySelector("button.on").dataset.k || 3);
  /* Два примера - подходящий и похожий неподходящий: правило понятно без слов. */
  const examples = () => {
    if(kind === "pattern"){
      const pat = ($("npattern").value || "").trim().toUpperCase();
      if(!pat) return ["-", "-"];
      const map = {}; let d = 2;
      const yes = pat.split("").map((ch) => (map[ch] = map[ch] || String(d++ % 10))).join("");
      return [yes, yes.slice(0, -1) + String((Number(yes.slice(-1)) + 1) % 10)];
    }
    const d = digits.size ? [...digits][0] : "7";
    const other = d === "1" ? "2" : "1";
    return [d.repeat(cnt), d.repeat(Math.max(1, cnt - 2)) + other + d];
  };
  const upd = () => { const [y, n] = on ? examples() : ["-", "-"]; $("nex-y").textContent = y; $("nex-n").textContent = n; };
  $("n-on").onclick = () => {
    on = !on; $("n-on").classList.toggle("on");
    $("n-body").style.display = on ? "block" : "none"; haptic(); upd();
    bindSeg("nk", (k) => setKind(k)); bindSeg("ncnt", (k) => { cnt = Number(k); upd(); });
  };
  const setKind = (k) => {
    kind = k;
    $("nrep").style.display = kind === "repeat" ? "block" : "none";
    $("npat").style.display = kind === "pattern" ? "block" : "none";
    upd();
  };
  bindSeg("nk", setKind);
  bindSeg("ncnt", (k) => { cnt = Number(k); upd(); });
  document.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => {
    const d = b.dataset.d;
    if(digits.has(d)) digits.delete(d); else digits.add(d);
    b.classList.toggle("on"); haptic(); upd();
  });
  $("nrow").onclick = () => { row = !row; $("nrow").classList.toggle("on"); haptic(); upd(); };
  $("npattern").oninput = upd;
  upd();
  return () => {
    if(!on) return { number_kind: "off" };
    if(kind === "pattern") return { number_kind: "pattern", pattern: ($("npattern").value || "").trim().toUpperCase() };
    return { number_kind: "repeat", digits: [...digits], count: cnt, in_row: row };
  };
}

/* ---------- справочники ----------
   Модели и фоны отдаёт бот (через Gift Satellite). Если он не смог - берём список
   из открытого каталога подарков: выбрать модель важнее, чем узнать её редкость. */
async function loadCatalog(slug){
  if(CATALOG[slug]) return CATALOG[slug];
  let cat = null;
  try{ cat = await call("catalog", { slug }); }catch(e){ cat = null; }
  cat = cat || { models: null, backdrops: null };
  if(!cat.models || !cat.models.length){
    await artIndex();
    try{
      const r = await fetch(`https://api.changes.tg/models/${encodeURIComponent(collName(slug))}`);
      const list = r.ok ? await r.json() : [];
      cat.models = list.map((m) => ({ name: m.name, pct: m.rarityPermille ? +(m.rarityPermille / 10).toFixed(1) : null }))
        .sort((a, b) => (a.pct || 99) - (b.pct || 99));
    }catch(e){ cat.models = cat.models || []; }
  }
  if(!cat.backdrops || !cat.backdrops.length){
    await artIndex();
    cat.backdrops = [...ART.bd.keys()].map((k) => ({ name: k.replace(/\b\w/g, (c) => c.toUpperCase()) }));
  }
  CATALOG[slug] = cat;
  return cat;
}

/* ===================== СВОИ НАДПИСИ =====================
   Владелец меняет любую надпись прямо в приложении: включает в админке «Режим правки»,
   удерживает палец на надписи и пишет новую. Замены хранятся у бота и приходят всем
   вместе с состоянием, сайт перезаливать не нужно.
   Ключ - исходная надпись; числа в ней заменены на {n}, поэтому «3 коллекции» и
   «12 коллекций» правятся одной записью (у разных падежей - свои записи).
   Применяем ко всему, что появляется на странице (MutationObserver): экранов и
   шторок десятки, и вызвать замену в каждом легко забыть. */
let TX = {};
try{ TX = JSON.parse(localStorage.getItem("gs_tx") || "{}") || {}; }catch(e){ TX = {}; }
const TX_NUM = /\d+(?:[.,  ]\d+)*/g;
const txSeen = new WeakMap();      // узел или поле -> { orig, shown }: что было и что показали
const TX_SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "SELECT"]);

const txKey = (s) => String(s || "").replace(/\s+/g, " ").trim();
function txPattern(s){
  const nums = [];
  const k = txKey(s).replace(TX_NUM, (m) => { nums.push(m); return "{n}"; });
  return { k, nums };
}
/* Чем заменить надпись, или null - оставить как есть. */
function txLookup(text){
  const { k, nums } = txPattern(text);
  if(!k || TX[k] == null) return null;
  let i = 0;
  return TX[k].replace(/\{n\}/g, () => (i < nums.length ? nums[i++] : ""));
}
/* Исходная надпись узла: если сейчас в нём наша замена - то, что было до неё. */
function txOrigOf(n, cur){
  const rec = txSeen.get(n);
  return rec && cur === rec.shown ? rec.orig : cur;
}
function txText(n){
  const orig = txOrigOf(n, n.data);
  const rep = txLookup(orig);
  if(rep == null){
    if(txSeen.has(n)){ txSeen.delete(n); if(n.data !== orig) n.data = orig; }
    return;
  }
  // пробелы по краям оставляем: ими надпись отделена от соседних
  const shown = orig.match(/^\s*/)[0] + rep + orig.match(/\s*$/)[0];
  txSeen.set(n, { orig, shown });
  if(n.data !== shown) n.data = shown;
}
function txPlaceholder(el){
  const cur = el.getAttribute("placeholder");
  if(cur == null || el.closest("[data-notx]")) return;
  const orig = txOrigOf(el, cur), rep = txLookup(orig);
  if(rep == null){
    if(txSeen.has(el)){ txSeen.delete(el); if(cur !== orig) el.setAttribute("placeholder", orig); }
    return;
  }
  txSeen.set(el, { orig, shown: rep });
  if(cur !== rep) el.setAttribute("placeholder", rep);
}
function txWalk(root){
  if(root.nodeType === 3){
    const p = root.parentElement;
    if(p && !TX_SKIP.has(p.tagName) && !p.closest("[data-notx]")) txText(root);
    return;
  }
  if(root.nodeType !== 1 || TX_SKIP.has(root.tagName) && root.tagName !== "INPUT") return;
  if(root.closest("[data-notx]")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: (n) => n.nodeType === 3 ? NodeFilter.FILTER_ACCEPT
      : (TX_SKIP.has(n.tagName) || n.hasAttribute("data-notx")) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP });
  for(let n = w.nextNode(); n; n = w.nextNode()) txText(n);
  if(root.hasAttribute("placeholder")) txPlaceholder(root);
  root.querySelectorAll("[placeholder]").forEach(txPlaceholder);
}
const txObs = new MutationObserver((list) => {
  for(const m of list){
    if(m.type === "childList") m.addedNodes.forEach(txWalk);
    else if(m.type === "characterData") txWalk(m.target);
    else txPlaceholder(m.target);
  }
  // свои же замены тоже попадают в список - выбрасываем, иначе ходили бы по кругу
  txObs.takeRecords();
});
txObs.observe(document.body, { childList: true, subtree: true, characterData: true,
  attributes: true, attributeFilter: ["placeholder"] });

function setTexts(t){
  TX = (t && typeof t === "object") ? t : {};
  try{ localStorage.setItem("gs_tx", JSON.stringify(TX)); }catch(e){}
  txWalk(document.body);
  txObs.takeRecords();
}

/* Что под пальцем: сама надпись (текстовый узел) или поле с подсказкой внутри. */
function txTargetAt(x, y, el){
  if(el && el.closest("[data-notx]")) return null;
  if(el && el.matches && el.matches("input[placeholder], textarea[placeholder]")) return el;
  let node = null;
  if(document.caretRangeFromPoint){
    const r = document.caretRangeFromPoint(x, y);
    node = r && r.startContainer;
  }else if(document.caretPositionFromPoint){
    const p = document.caretPositionFromPoint(x, y);
    node = p && p.offsetNode;
  }
  if(node && node.nodeType === 3 && txKey(node.data) && el && el.contains(node)) return node;
  // палец попал между буквами: берём первую надпись в нажатом элементе
  const w = el && document.createTreeWalker(el, NodeFilter.SHOW_TEXT,
    { acceptNode: (n) => txKey(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  return w ? w.nextNode() : null;
}
let txHold = null, txSuppress = false, txFrom = null;
document.addEventListener("pointerdown", (e) => {
  if(!TXEDIT || e.target.closest("[data-notx]")) return;
  const x = e.clientX, y = e.clientY, el = e.target;
  txFrom = [x, y];
  clearTimeout(txHold);
  txHold = setTimeout(() => {
    const t = txTargetAt(x, y, el);
    if(!t) return;
    // палец отпустят над кнопкой - этот щелчок не должен её нажать
    txSuppress = true; setTimeout(() => { txSuppress = false; }, 700);
    haptic("medium");
    txOpen(t);
  }, 480);
}, { passive: true });
["pointerup", "pointercancel", "scroll"].forEach((ev) =>
  document.addEventListener(ev, () => clearTimeout(txHold), { passive: true, capture: true }));
document.addEventListener("pointermove", (e) => {
  // палец повёл - это прокрутка, а не удержание
  if(txFrom && Math.hypot(e.clientX - txFrom[0], e.clientY - txFrom[1]) > 10) clearTimeout(txHold);
}, { passive: true });
document.addEventListener("click", (e) => {
  if(txSuppress && !e.target.closest("#txed")){ e.preventDefault(); e.stopPropagation(); txSuppress = false; }
}, true);
// на компьютере - правой кнопкой, на Android долгое нажатие тоже присылает это событие
document.addEventListener("contextmenu", (e) => {
  if(!TXEDIT) return;
  e.preventDefault();
  if($("txed").classList.contains("on") || e.target.closest("[data-notx]")) return;
  clearTimeout(txHold);
  const t = txTargetAt(e.clientX, e.clientY, e.target);
  if(t) txOpen(t);
});

/* Окно правки одной надписи. Своё, а не шторка: правят и надписи в открытой шторке. */
function txOpen(target){
  const cur = target.nodeType === 3 ? target.data : target.getAttribute("placeholder");
  txOpenKey(txPattern(txOrigOf(target, cur)).k);
}
function txOpenKey(key){
  if(!key) return;
  const has = TX[key] != null, withNum = key.includes("{n}");
  $("txed").innerHTML = `<div class="txcard">
    <h3>Изменить надпись</h3>
    <div class="txwas"><span>Было</span>${esc(key)}</div>
    <textarea id="txin" rows="3" maxlength="500"></textarea>
    ${withNum ? `<div class="hint">{n} - сюда встанет число, его можно переставить или убрать.</div>` : ""}
    <div class="hint">Поменяется везде, где стоит эта надпись, у всех пользователей.</div>
    <div class="err" id="txerr"></div>
    <div class="txbtns"><button class="btn" id="txno">Отмена</button>
      <button class="btn blue" id="txok">${ic("check")}Сохранить</button></div>
    ${has ? `<button class="btn ghost" id="txback">Вернуть как было</button>` : ""}</div>`;
  $("txin").value = has ? TX[key] : key;
  $("txed").classList.add("on");
  setTimeout(() => { const i = $("txin"); i.focus(); i.select(); }, 60);
  const done = () => $("txed").classList.remove("on");
  const send = async (val) => {
    try{
      await call("admin", { texts: { [key]: val } });
      done(); hapticOk(); toast(val ? "Надпись изменена" : "Надпись возвращена");
      if($("v-admin").classList.contains("on")) render();
    }catch(err){ $("txerr").textContent = err.message; }
  };
  $("txno").onclick = done;
  $("txok").onclick = () => {
    const val = txKey($("txin").value);
    if(!val){ $("txerr").textContent = "Напиши новую надпись или нажми «Вернуть как было»"; return; }
    send(val === key ? "" : val);
  };
  if(has) $("txback").onclick = () => send("");
}
$("txed").addEventListener("click", (e) => { if(e.target === $("txed")) $("txed").classList.remove("on"); });

/* ===================== ЗАГРУЗКА =====================
   Под экраном загрузки уже нарисована главная (с прошлого захода или заготовка) и
   размыта. Логотип вылетает из-за нижнего края с хвостом искр, растёт к центру,
   покачивается и взрывается частицами - как тотем бессмертия. Когда данные готовы,
   логотип улетает «в экран», размытие тает. Эффект выключается в админке - тогда
   логотип просто стоит в центре. */
const TOTEM = ["#ffffff", "#bfe0ff", "#6cc6ff", "#2f9bff", "#ffe27a", "#9ff0ff"];
const BOOT_FLY = 1250;
let bootSpark = 0;
function logoCenter(){
  const r = $("boot-logo").getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function bootFly(){
  const w = $("boot-logo");
  const P3 = "perspective(700px)";
  w.animate([
    { transform: `${P3} translate(-24vw, 72vh) scale(.14) rotate(-38deg) rotateY(75deg)`, opacity: 0,
      easing: "cubic-bezier(.32,.5,.3,1)" },
    { opacity: 1, offset: .08 },
    { transform: `${P3} translate(0, 0) scale(1.55) rotate(9deg) rotateY(-24deg)`, offset: .5, easing: "ease-in-out" },
    { transform: `${P3} scale(.9) rotate(-5deg) rotateY(14deg)`, offset: .67, easing: "ease-in-out" },
    { transform: `${P3} scale(1.07) rotate(2deg) rotateY(-6deg)`, offset: .83, easing: "ease-in-out" },
    { transform: `${P3} scale(1) rotate(0) rotateY(0)`, opacity: 1 },
  ], { duration: BOOT_FLY, fill: "both" });
  // хвост из искр за летящим логотипом
  const t0 = performance.now();
  const tail = () => {
    if(performance.now() - t0 > BOOT_FLY * .48) return;
    const [x, y] = logoCenter();
    // пока логотип за краем экрана, искры не сыплем: копятся облаком внизу
    if(y < innerHeight - 20) FX.burst(x, y, { n: 3, speed: 2.4, gravity: .03, drag: .95, life: 40, size: 5,
      colors: TOTEM, kinds: ["px", "star", "dot"] });
    requestAnimationFrame(tail);
  };
  requestAnimationFrame(tail);
  // прилёт: вспышка и взрыв частиц, часть искр потом медленно всплывает
  setTimeout(() => {
    const [x, y] = logoCenter(), b = $("boot");
    b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
    haptic("medium");
    FX.burst(x, y, { n: 150, speed: 13, gravity: .07, drag: .965, life: 95, size: 7, colors: TOTEM,
      kinds: ["px", "px", "star", "dot"], ring: 70 });
    FX.burst(x, y, { n: 60, speed: 5, gravity: -.025, drag: .985, life: 150, size: 4.5, colors: TOTEM,
      kinds: ["px", "star"], ring: 80 });
  }, BOOT_FLY * .5);
  // пока ждём данные - вокруг логотипа то и дело вспыхивают искры
  clearInterval(bootSpark);
  bootSpark = setInterval(() => {
    const [x, y] = logoCenter(), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 40;
    FX.burst(x + Math.cos(a) * d, y + Math.sin(a) * d, { n: 3, speed: 1.2, gravity: -.02, drag: .97,
      life: 55, size: 5, colors: TOTEM, kinds: ["star", "px"] });
  }, 260);
}
function bootStart(){
  const b = $("boot"), w = $("boot-logo");
  w.getAnimations().forEach((x) => x.cancel());
  w.innerHTML = `<div class="lg-float">${BRAND.svg}</div>`;
  $("boot-word").innerHTML = BRAND.word;
  $("boot-tag").textContent = BRAND.tag;
  const anim = fxOn("boot");
  b.classList.remove("play", "out", "still", "gone", "hit");
  void b.offsetWidth;
  b.classList.add(anim ? "play" : "still");
  if(anim) bootFly();
  return anim;
}
async function bootHide(anim){
  const b = $("boot");
  clearInterval(bootSpark);
  if(anim){
    const [x, y] = logoCenter();
    $("boot-logo").animate([
      { transform: "scale(1)", opacity: 1, filter: "blur(0)" },
      { transform: "scale(.86)", opacity: 1, filter: "blur(0)", offset: .25 },
      { transform: "scale(2.7)", opacity: 0, filter: "blur(6px)" },
    ], { duration: 520, easing: "cubic-bezier(.5,0,.75,.4)", fill: "forwards" });
    setTimeout(() => FX.burst(x, y, { n: 110, speed: 15, size: 7, life: 70, gravity: .06, colors: TOTEM,
      kinds: ["px", "star", "dot"], ring: 60 }), 140);
    b.classList.add("out");
    await sleep(540);
  }
  b.classList.add("gone");
}

  return `<div class="skel"><i style="width:38%;height:20px"></i><i style="width:72%;height:38px;margin-top:14px"></i>
    <i style="height:70px;margin-top:22px;border-radius:24px"></i>
    <i style="height:210px;margin-top:14px;border-radius:30px"></i>
    <div style="display:flex;gap:12px;margin-top:12px"><i style="height:160px;flex:1;border-radius:28px"></i>
      <i style="height:160px;flex:1;border-radius:28px"></i></div></div>`;
}
function bootBackdrop(){
  let st = null;
  if(DEMO) st = demoState();
  else try{ st = JSON.parse(localStorage.getItem("gs_last") || "null"); }catch(e){ st = null; }
  if(st && st.uid){
    try{ setState(st); render(); return; }
    // сохранённое состояние могло остаться от старой версии сайта - тогда заготовка
    catch(e){ console.warn("старое состояние:", e); S = null; }
  }
  $("v-home").innerHTML = homeSkeleton();
}
function rememberState(){
  if(DEMO || !S) return;
  try{ localStorage.setItem("gs_last", JSON.stringify(S)); }catch(e){ /* память браузера полна - просто не запомним */ }
}
async function boot(){
  artIndex();
  const t0 = performance.now();
  bootBackdrop();
  const anim = bootStart();
  // Для выбора логотипа: экран загрузки стоит на месте (?boothold=1) или
  // проигрывается по кругу (?bootloop=1).
  if(P.get("boothold") === "1") return;
  if(P.get("bootloop") === "1"){
    for(;;){ await sleep(2600); await bootHide(true); await sleep(900); bootStart(); }
  }
  if(!API && !DEMO){
    await bootHide(false);
    $("v-home").innerHTML = `<div class="empty" style="margin-top:40px"><b>Не задан адрес бота</b>
      Открой приложение кнопкой в боте.</div>`;
    return;
  }
  try{
    const data = await call("state", {});
    setState(data.uid ? data : data.state);
    // Человеческие названия коллекций («Loot Bag», а не «LootBag») берутся из
    // каталога. Ждём его недолго: без каталога экран всё равно рисуется.
    await Promise.race([artIndex(), sleep(2000)]);
    render();
    rememberState();
    startRefresh();
    // логотип должен успеть долететь и немного покрасоваться
    if(anim) await sleep(Math.max(0, BOOT_FLY + 700 - (performance.now() - t0)));
    await bootHide(anim);
    moveInd();
  }catch(e){
    $("boot-sub").textContent = "Нет связи с ботом";
    await sleep(900);
    await bootHide(false);
    $("v-home").innerHTML = `<div class="empty" style="margin-top:40px"><b>Не соединился с ботом</b>
      ${esc(e.message)}<br><br>Адрес данных: <span class="num">${esc(API || "не задан")}</span><br>
      Проверь, что бот запущен: <span class="num">${esc(API)}/api/ping</span> должен ответить «ok».</div>`;
  }
}

/* ===================== ЗАПУСК ===================== */
document.querySelectorAll("nav [data-go]").forEach((b) => b.onclick = () => { haptic(); go(b.dataset.go); });
$("veil").onclick = closeSheet;
addEventListener("resize", moveInd);

/* Щипок и двойное касание: iOS игнорирует meta viewport внутри WebView. */
["gesturestart", "gesturechange", "gestureend"].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", (e) => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTap = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if(now - lastTap < 300 && !e.target.closest("input")) e.preventDefault();
  lastTap = now;
}, { passive: false });

if(TG){
  TG.ready(); TG.expand();
  try{ TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){}
  try{ TG.setHeaderColor("#000000"); TG.setBackgroundColor("#000000"); TG.setBottomBarColor && TG.setBottomBarColor("#000000"); }catch(e){}
  if(TG.BackButton) TG.BackButton.onClick(() => {
    if($("sheet").classList.contains("on")) closeSheet(); else if(!ORDER.includes(VIEW)) go("profile");
  });
  const sp = String((TG.initDataUnsafe && TG.initDataUnsafe.start_param) || "").toLowerCase();
  if(["sniper", "flip", "portfolio", "profile", "settings"].includes(sp)) VIEW = sp;
}
const startView = P.get("view");
if(startView && document.getElementById("v-" + startView)) VIEW = startView;
if(VIEW !== "home") go(VIEW);
moveInd();
boot();
</script>
