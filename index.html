   подарка, сводка по расписанию и итог недели. */
function portfolioNotify(n){
  const st = { on: !!n.on, moves: n.moves !== false, threshold: Number(n.threshold || 10),
    summary_at: String(n.summary_at || "20:00"), summary_every: String(n.summary_every || "day"),
    weekly: n.weekly !== false };
  openSheet(`<h2><span class="tile red">${ic("bell")}</span>Уведомления</h2>
    <p class="sub">Приходят в чат бота</p>
    <div class="group plain"><div class="row"><span class="t"><b>Включить</b><span>без этого остальное не работает</span></span>
      <button class="tgl ${st.on ? "on" : ""}" id="n-on"></button></div></div>
    <div id="n-body" style="display:${st.on ? "block" : "none"}">
      <div class="group plain"><div class="row"><span class="t"><b>Резкое движение цены</b><span>по каждому подарку</span></span>
        <button class="tgl ${st.moves ? "on" : ""}" id="n-moves"></button></div></div>
      <div id="n-th" style="display:${st.moves ? "block" : "none"}"><label>Порог</label>
        ${segHtml("nth", [5, 10, 15, 25].map((v) => [v, "±" + v + "%"]), st.threshold)}</div>
      <label>Сводка</label>
      ${segHtml("nev", [["6h", "6 ч"], ["12h", "12 ч"], ["day", "сутки"], ["off", "нет"]], st.summary_every)}
      <div id="n-at" style="display:${st.summary_every === "off" ? "none" : "block"}"><label>Во сколько</label>
        <div class="seg wrap" id="nat">${["09:00", "12:00", "15:00", "18:00", "20:00", "23:00"].map((h) =>
          `<button data-k="${h}" class="${st.summary_at === h ? "on" : ""}">${h}</button>`).join("")}</div></div>
      <div class="group plain" style="margin-top:14px"><div class="row"><span class="t"><b>Итог недели</b>
        <span>прибыль или убыток, лучшие и худшие подарки</span></span>
        <button class="tgl ${st.weekly ? "on" : ""}" id="n-week"></button></div></div>
    </div>
    <button class="btn blue" style="margin-top:16px" id="ok">${ic("check")}Сохранить</button>`);
  const tg = (id, key, after) => { $(id).onclick = () => { st[key] = !st[key]; $(id).classList.toggle("on", st[key]); haptic(); if(after) after(); }; };
  tg("n-on", "on", () => { $("n-body").style.display = st.on ? "block" : "none"; bindAll(); });
  tg("n-moves", "moves", () => { $("n-th").style.display = st.moves ? "block" : "none"; bindAll(); });
  tg("n-week", "weekly");
  const bindAll = () => {
    bindSeg("nth", (k) => { st.threshold = Number(k); });
    bindSeg("nev", (k) => { st.summary_every = k; $("n-at").style.display = k === "off" ? "none" : "block"; });
  };
  bindAll();
  $("nat").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("nat").querySelectorAll("button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); st.summary_at = b.dataset.k; haptic();
  });
  $("ok").onclick = async () => {
    try{ await call("portfolio_notify", st); closeSheet(); renderPortfolio(); toast("Настройки сохранены", "bell"); }
    catch(e){ toast(e.message, "help"); }
  };
}

/* ===================== РЫНОК, НАХОДКИ, АЛЕРТЫ =====================
   Данные для главной приходят отдельным запросом (home), а не в общем состоянии:
   флоры и находки обновляются сами по себе, и тащить их в каждый ответ незачем.
   Цены считает бот (Gift Satellite): без ключа их нет, и мы так и пишем, а не
   рисуем правдоподобные числа. */
let HOME = null, HOME_AT = 0, FLOORS = null, FLOORS_AT = 0, NEWC = null;

function ago(sec){
  const d = Math.max(0, Date.now() / 1000 - Number(sec || 0));
  if(d < 90) return "только что";
  if(d < 3600) return `${Math.round(d / 60)} мин назад`;
  if(d < 86400) return `${Math.round(d / 3600)} ч назад`;
  return `${Math.round(d / 86400)} д назад`;
}
const MONTHS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function dayMonth(sec){
  const d = new Date(Number(sec) * 1000);
  // прошлогодняя дата без года читалась бы как недавняя
  const y = d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : "";
  return `${d.getDate()} ${MONTHS[d.getMonth()]}${y}`;
}
function openUrl(u){
  if(!u) return;
  if(/^https:\/\/t\.me\//.test(u) && TG && TG.openTelegramLink) TG.openTelegramLink(u);
  else if(TG && TG.openLink) TG.openLink(u); else window.open(u, "_blank");
}

/* Главная: подгрузить раз в минуту и перерисовать только свой кусок. */
async function loadHome(force){
  if(!force && HOME && Date.now() - HOME_AT < 60e3) return;
  try{ HOME = await call("home", {}); HOME_AT = Date.now(); }catch(e){ return; }

}
async function loadNewColls(){
  if(NEWC) return;
  try{
    const r = await fetch(`${API_ART}/dates`);

    // Только подарки, у которых есть коллекция в каталоге (у остальных нет имени).
    const byId = new Map([...ART.names.values()].map((v) => [String(v.id), v.name]));
    NEWC = list.filter((x) => x && byId.has(String(x.id)))
      .map((x) => ({ ...x, name: byId.get(String(x.id)) }))
      .sort((a, b) => (b.releasedAt || 0) - (a.releasedAt || 0)).slice(0, 8);
  }catch(e){ NEWC = []; }
  paintHomeExtra();
}

function homeExtraHtml(){
  const h = HOME || { market: [], finds: [] };
  let out = "";
  if(h.market && h.market.length && (h.prices || h.market.some((m) => m.floor))){
    out += `<div class="sec big">Рынок моих коллекций</div><div class="group">${h.market.map((m) => `
      <button class="row mrow" data-mk="${esc(m.slug)}">${art(collName(m.slug), "", "mini")}
        <span class="t"><b>${esc(collName(m.slug))}</b><span>${m.at ? "флор, " + ago(m.at) : "флор ещё не посчитан"}</span></span>
        <span class="v w"><b class="num">${m.floor ? fmtTon(m.floor) + " TON" : "-"}</b>
          ${m.change_24h != null ? deltaHtml(m.change_24h) : ""}</span></button>`).join("")}</div>`;
  } else if(S && S.is_owner && HOME && !h.prices){
    out += `<div class="sec big">Рынок моих коллекций</div>
      <div class="hint">Цены появятся, когда к боту подключён ключ Gift Satellite.</div>`;
  }
  out += `<div class="sec big">Последние находки</div>`;
  out += (h.finds && h.finds.length) ? `<div class="group">${h.finds.map((f, i) => `
      <button class="row" data-find="${i}">${art(collName(f.slug), f.model, "mini")}
        <span class="t"><b>${esc(collName(f.slug))}${f.num ? " #" + esc(f.num) : ""}</b>

        ${f.price ? `<span class="v w"><b class="num">${fmtTon(f.price)} TON</b></span>` : ""}</button>`).join("")}</div>`
    : `<div class="hint">Здесь появятся подарки, о которых бот тебе написал.</div>`;
  if(NEWC && NEWC.length){
    out += `<div class="sec big">Новые коллекции</div><div class="hscroll">${NEWC.map((c) => `
      <div class="gcard newc" style="--c1:#26324d;--c2:#121827">${sparkles(3, .35)}${art(c.name, "")}
        <div class="nm">${esc(c.name)}</div>
        <div class="sb">вышла ${dayMonth(c.releasedAt)}</div>
        <div class="pr"><span>${c.upgradableAt ? "улучшения " + dayMonth(c.upgradableAt)
          : c.upgradable ? "улучшается" : "без улучшений"}</span></div></div>`).join("")}</div>`;
  }
  if(h.status) out += statusHtml(h.status);
  return out;
}
/* Состояние бота - только владельцу. Точка зелёная, если часть работает как надо. */
function statusHtml(st){
  const row = (ok, title, sub) => `<div class="row"><span class="sdot ${ok === null ? "mid" : ok ? "ok" : "bad"}"></span>
    <span class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></span></div>`;
  const sn = st.sniper || {}, fl = st.flip || {}, g = st.gsb || {};
  const passAgo = sn.last_pass ? Date.now() / 1000 - sn.last_pass : null;
  const up = Math.round((st.uptime || 0) / 3600);
  return `<div class="sec big">Состояние бота</div><div class="group plain">
    ${row(passAgo !== null && passAgo < 900, "Слежение за улучшениями",
      sn.last_pass ? `${nColl(sn.collections || 0)}, проход ${ago(sn.last_pass)}` : "первый проход ещё идёт")}
    ${fl.enabled ? row(fl.notify_chat && fl.subscribed >= fl.tracked, "Листинги",
      fl.notify_chat ? `подписок ${fl.subscribed} из ${fl.tracked}` : "не настроена группа уведомлений") : ""}
    ${row(g.keys ? (g.dead ? null : true) : false, "Gift Satellite",
      g.keys ? `ключей ${g.keys}${g.dead ? `, не принимаются ${g.dead}` : ", все работают"}` : "ключ не задан")}
    ${row(st.floors_at ? Date.now() / 1000 - st.floors_at < 7200 : false, "Цены",
      st.floors_at ? "флоры обновлены " + ago(st.floors_at) : "ещё не обновлялись")}
    ${row(true, "Работает", `${up < 1 ? "меньше часа" : up + " ч"}, людей ${st.users || 0}`)}
  </div>`;
}

/* ---------- сортировка по цене ----------
   Коллекции: флоры бот обходит раз в час, берём их одним запросом. Модели: бот
   считает при первом запросе (несколько секунд), пока считает - отвечает pending,
   и мы спрашиваем ещё раз. */
async function collFloors(){
  if(FLOORS && Date.now() - FLOORS_AT < 600e3) return FLOORS;
  try{ FLOORS = (await call("floors", {})).collections || {}; FLOORS_AT = Date.now(); }catch(e){ FLOORS = FLOORS || {}; }
  return FLOORS;
}
function sortByFloor(items, floorOf){
  // дорогие первыми; без цены - после, в прежнем порядке (редкие раньше)
  items.forEach((x, i) => { x._i = i; });
  items.sort((a, b) => {
    const fa = floorOf(a), fb = floorOf(b);
    if(fa && fb) return fb - fa;
    if(fa) return -1;
    if(fb) return 1;
    return a._i - b._i;
  });
}
/* Флоры моделей: кладём в items[].floor, сортируем, перерисовываем. Пока человек
   уже листает раскрытый список, порядок не трогаем - только подписи цен: прыгающий
   под пальцем список и был одной из жалоб. */
async function modelFloors(slug, items, redraw, isOpen){
  const names = items.map((x) => x.name);
  for(let i = 0; i < 18; i++){
    let r = null;
    try{ r = await call("model_floors", { slug, models: names }); }catch(e){ return; }
    if(!r || r.why) return;
    items.forEach((x) => { if(r.floors[x.name]) x.floor = r.floors[x.name]; });
    if(!isOpen || !isOpen()) sortByFloor(items, (x) => x.floor);
    redraw();
    if(!r.pending || !$("sheet").classList.contains("on")) return;
    await sleep(2500);
  }
}

function bindQuiet(){
  let mode = $("q-m") ? ($("q-m").querySelector("button.on") || {}).dataset.k || "silent" : "silent";
  const mins = (v) => { const [h, m] = String(v || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  // смещение пояса в минутах к востоку от UTC: Москва = +180
  const tz = -new Date().getTimezoneOffset();
  const send = (q, msg) => save("settings", { quiet: q }, msg);
  $("q-on").onclick = () => {
    const on = !$("q-on").classList.contains("on");
    $("q-on").classList.toggle("on", on); haptic();
    $("q-body").style.display = on ? "block" : "none";
    if(!on) send({ mode: "off", start: 0, end: 0, tz }, "Тихие часы выключены");
  };
  bindSeg("q-m", (k) => { mode = k; });
  $("q-ok").onclick = () => {
    const s = mins($("q-s").value), e = mins($("q-e").value);
    if(s === e){ toast("Начало и конец совпадают", "help"); return; }
    send({ mode, start: s, end: e, tz }, "Тихие часы сохранены");
  };
}

/* ===================== БАННЕРЫ =====================
   Карусель вверху главной: действующая акция и объявление (собираются из
   state.announcements) и баннеры владельца (state.banners). Если баннеров
   несколько, они сменяют друг друга каждые 5 секунд; можно листать пальцем.
   Выключатель в админке прячет карусель целиком.

   Баннер - фон (цвет или картинка с кадром) и слои поверх: текст, кнопка, подарок,
   таймер. Положение слоя - в процентах баннера, размер - в сотых его ширины (--u),
   поэтому баннер одинаковый на любом телефоне и в предпросмотре редактора. */
const BN_COLORS = { violet: ["#7b5cff", "#b45cf2"], blue: ["#3f8cff", "#1d5fd6"], green: ["#2fbf71", "#138a52"],
  orange: ["#ff9f43", "#ff6b3d"], pink: ["#ff5fa2", "#c2337a"], dark: ["#2a2f3d", "#12151e"] };
const BN_GO = [["sniper", "Улучшения"], ["flip", "Листинги"], ["portfolio", "Портфель"], ["buy", "Купить слот"],
  ["profile", "Профиль"]];
const BN_AUD = [["all", "Всем"], ["slots", "Со слотами"], ["noslots", "Без слотов"], ["ru", "Русский"], ["en", "English"]];
const BN_PAL = ["#ffffff", "#000000", "#ffd60a", "#ff9f0a", "#ff453a", "#ff375f", "#bf5af2", "#5e5ce6", "#2f7cf6",
  "#40c8e0", "#30d158", "#8e8e93"];
const BN_LAYER_NAMES = { text: "Текст", button: "Кнопка", gift: "Подарок", timer: "Таймер" };
let bnTimer = 0;

/* Картинка баннера: только что загруженная - сразу из памяти; с бота - через
   assetUrl (см. 3a_core.js), и подставляется в разметку, когда придёт. */
function bannerImg(b){
  if(b && b._local) return b._local;
  return "";
}
function fillBannerImages(root){
  (root || document).querySelectorAll("[data-bnimg]").forEach((el) => {
    const f = el.dataset.bnimg;
    delete el.dataset.bnimg;
    assetUrl("banner", f).then((u) => {
      if(!u) return;
      if(el.tagName === "IMG") el.src = u; else el.style.backgroundImage = `url('${u}')`;
    });
  });
}
function shade(hex, k){
  const n = parseInt(String(hex).slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))).toString(16).padStart(2, "0");
  return "#" + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
}
function bnBgCss(bg){
  const c = (bg && bg.color) || "violet";
  if(c[0] === "#") return `background:linear-gradient(120deg,${c},${shade(c, .62)})`;
  const p = BN_COLORS[c] || BN_COLORS.violet;
  return `background:linear-gradient(120deg,${p[0]},${p[1]})`;
}
/* Акция и объявление - тоже баннеры из слоёв, чтобы карусель была одинаковой. */
function homeBanners(){
  if(!S || S.banners_on === false) return [];
  const auto = (S.announcements || []).map((a) => {
    const promo = a.kind === "promo";
    // слева, с переносом строк: тексты акции и объявления бывают длинными
    const layers = [
      { type: "text", text: a.title || "", x: 5, y: promo ? 22 : 30, size: 6.4, weight: 800, color: "#ffffff", w: 90 },
      { type: "text", text: a.text || "", x: 5, y: promo ? 49 : 62, size: 4.3, weight: 400, color: "#f0f0f5", w: 90 }];
    if(promo && S.flip && S.flip.enabled) layers.push({ type: "button", text: "Купить слот", action: "go", target: "buy",
      x: 5, y: 80, size: 4.2, weight: 700, color: "#000000", bgc: "#ffffff" });
    return { auto: true, notice: !promo, bg: { color: promo ? "violet" : "blue" }, fx: { sparkles: true },
      layers: layers.filter((l) => l.text), left: true };
  });
  // акция и объявление - первыми: они про «сейчас»
  return auto.concat(S.banners || []);
}
function layerCss(L, left){
  const base = `left:${L.x}%;top:${L.y}%;transform:translate(${left ? "0" : "-50%"},-50%) rotate(${L.r || 0}deg)`;
  if(L.type === "gift") return `${base};width:calc(var(--u) * ${L.size})`;
  let s = `${base};font-size:calc(var(--u) * ${L.size});color:${L.color || "#fff"};font-weight:${L.weight || 600}`;
  if(L.w) s += `;width:${L.w}%;white-space:normal`;
  if(L.shadow) s += ";text-shadow:0 .06em .18em rgba(0,0,0,.55)";
  if(L.outline) s += ";-webkit-text-stroke:.12em #000;paint-order:stroke fill";
  if(L.bgc) s += `;background:${L.bgc}`;
  return s;
}
function cdText(to, prefix){
  let s = Math.max(0, Math.floor(to - Date.now() / 1000));
  if(!s) return (prefix ? prefix + " " : "") + "00:00:00";
  const d = Math.floor(s / 86400); s %= 86400;
  const p = (n) => String(n).padStart(2, "0");
  const t = `${p(Math.floor(s / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}`;
  return `${prefix ? prefix + " " : ""}${d ? `${d} д ` : ""}${t}`;
}
function layerHtml(L, i, b){
  const notx = b.auto && !b.notice ? "" : "data-notx";
  const st = layerCss(L, b.left);
  if(L.type === "gift") return `<div class="bl bl-gift" data-li="${i}" style="${st}">${art(L.coll, L.model || "", "", true)}</div>`;
  if(L.type === "timer") return `<div class="bl bl-text ${L.bgc ? "pad" : ""}" data-li="${i}" data-cd="${L.to}"
    data-cdp="${esc(L.text || "")}" ${notx} style="${st}">${esc(cdText(L.to, L.text))}</div>`;
  const cls = L.type === "button" ? "bl-btn" : `bl-text ${L.bgc ? "pad" : ""}`;
  return `<div class="bl ${cls}" data-li="${i}" ${notx} style="${st}">${esc(L.text || "")}</div>`;
}
function bannerHtml(b, i){
  const bg = b.bg || {};
  const img = bannerImg(b);
  const fx = b.fx || {};
  const imgTag = bg.image || img ? `<img class="bnr-img" alt="" ${img ? `src="${esc(img)}"` : `data-bnimg="${esc(bg.image)}"`}
      style="object-position:${bg.x ?? 50}% ${bg.y ?? 50}%;transform-origin:${bg.x ?? 50}% ${bg.y ?? 50}%;transform:scale(${bg.z || 1})">
    <div class="bnr-dim" style="opacity:${bg.dim ?? .25}"></div>` : "";
  return `<div class="bnr v2 ${fx.shine ? "shine" : ""}" data-bn="${i}" style="${imgTag ? "background:#111" : bnBgCss(bg)}">
    ${imgTag}${fx.sparkles ? sparkles(6, .45) : ""}
    ${(b.layers || []).map((L, n) => layerHtml(L, n, b)).join("")}</div>`;
}
function bannersBlock(){
  const list = homeBanners();
  if(!list.length) return "";
  return `<div class="bnrs" id="bnrs"><div class="bnr-track" id="bnr-track">${list.map(bannerHtml).join("")}</div>
    ${list.length > 1 ? `<div class="bnr-dots">${list.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>`;
}
/* Сотая ширины баннера - в переменную --u: от неё считаются размеры слоёв. */
const bnRO = "ResizeObserver" in window ? new ResizeObserver((list) => list.forEach((en) => {
  const w = en.contentRect.width;
  if(w) en.target.style.setProperty("--u", (w / 100).toFixed(3) + "px");
})) : null;
function sizeBanners(root){
  (root || document).querySelectorAll(".bnr.v2").forEach((el) => {
    if(el.clientWidth) el.style.setProperty("--u", (el.clientWidth / 100).toFixed(3) + "px");
    if(bnRO) bnRO.observe(el);
  });
}
// таймеры на баннерах - раз в секунду, только видимые
setInterval(() => {
  if(document.hidden) return;
  document.querySelectorAll("[data-cd]").forEach((el) => {
    if(el.offsetParent) el.textContent = tr(cdText(Number(el.dataset.cd), el.dataset.cdp));
  });
}, 1000);
const BN_SEEN = new Set();
function bindBanners(){
  clearInterval(bnTimer);
  const tr = $("bnr-track");
  if(!tr) return;
  fillBannerImages(tr);
  sizeBanners(tr);
  const list = homeBanners();
  // показы: баннеры владельца, один раз за заход (бот ещё раз отсеет повторы за сутки)
  const fresh = list.filter((b) => b.id && !BN_SEEN.has(b.id)).map((b) => b.id);
  if(fresh.length && !DEMO){
    fresh.forEach((id) => BN_SEEN.add(id));
    call("banner_seen", { ids: fresh }).catch(() => { /* статистика не важнее главной */ });
  }
  const dots = [...document.querySelectorAll("#bnrs .bnr-dots i")];
  const step = () => (tr.children[1] ? tr.children[1].offsetLeft - tr.children[0].offsetLeft : tr.clientWidth) || 1;
  const idx = () => Math.round(tr.scrollLeft / step());
  tr.addEventListener("scroll", () => { const k = idx(); dots.forEach((d, i) => d.classList.toggle("on", i === k)); },
    { passive: true });
  let touched = 0;
  tr.addEventListener("pointerdown", () => { touched = Date.now(); }, { passive: true });
  if(list.length > 1) bnTimer = setInterval(() => {
    if(VIEW !== "home" || !document.body.contains(tr)){ clearInterval(bnTimer); return; }
    // человек листает сам или открыл окно - не перебиваем
    if(Date.now() - touched < 7000 || $("sheet").classList.contains("on") || document.hidden) return;
    tr.scrollTo({ left: ((idx() + 1) % list.length) * step(), behavior: REDUCED ? "auto" : "smooth" });
  }, 5000);
  tr.querySelectorAll("[data-bn]").forEach((el) => el.onclick = (e) => {
    const b = list[+el.dataset.bn];
    const hit = e.target.closest(".bl-btn");
    const L = hit ? b.layers[+hit.dataset.li] : null;
    // нажали на кнопку - её действие; мимо - действие баннера или первой кнопки
    const act = L || (b.tap && b.tap.action !== "none" ? b.tap : (b.layers || []).find((x) => x.type === "button"));
    if(!act) return;
    if(b.id && !DEMO) call("banner_tap", { id: b.id }).catch(() => { /* не мешаем переходу */ });
    bannerAct(act);
  });
}
function bannerAct(a){
  if(!a || !a.action || a.action === "none") return;
  haptic();
  if(a.action === "url") openUrl(a.target);
  else if(a.target === "buy"){ go("flip"); setTimeout(buySlot, 450); }
  else go(a.target);
}

/* ---------- админка: редактор баннера ----------
   Сверху живой предпросмотр - тот же баннер, что увидят люди. Слой выбирается
   нажатием; один палец двигает, два - увеличивают и поворачивают. Если выбран фон
   с картинкой, пальцы двигают и увеличивают картинку (кадр). Ползунки ниже - для
   точной настройки. */
function dtLocal(ts){
  if(!ts) return "";
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocal(v){
  const t = v ? new Date(v).getTime() : NaN;
  return isFinite(t) ? Math.floor(t / 1000) : 0;
}
function swatches(id, value, allowNone){
  return `<div class="bnpal" id="${id}">${allowNone ? `<button class="bnsw0 ${value ? "" : "on"}" data-v="">${ic("cross")}</button>` : ""}
    ${BN_PAL.map((c) => `<button class="${c === value ? "on" : ""}" data-v="${c}" style="background:${c}"></button>`).join("")}
    <label class="bnpick ${value && !BN_PAL.includes(value) ? "on" : ""}" style="${value && !BN_PAL.includes(value) ? `background:${value}` : ""}">
      ${ic("plus")}<input type="color" value="${value || "#ffffff"}"></label></div>`;
}
function bindSwatches(id, onPick){
  const box = $(id);
  if(!box) return;
  const set = (v) => {
    box.querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
    const b = box.querySelector(`[data-v="${v}"]`);
    if(b) b.classList.add("on");
    else if(v){ const p = box.querySelector(".bnpick"); p.classList.add("on"); p.style.background = v; }
    onPick(v);
  };
  box.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { haptic(); set(b.dataset.v); });
  box.querySelector("input[type=color]").oninput = (e) => set(e.target.value.toLowerCase());
}
function slider(id, label, min, max, step, value, suf){
  return `<div class="bnsl"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}">
    <b id="${id}-v">${Math.round(value * 10) / 10}${suf || ""}</b></div>`;
}

    <input type="text" id="bn-tapurl" placeholder="https://t.me/..." style="margin-top:10px;display:${ed.tap.action === "url" ? "block" : "none"}"

    ${st ? `<label>Статистика</label><div class="gres"><div><span>Показы</span><b class="num">${st.views}</b></div>

    <div class="group plain" style="margin-top:12px"><div class="row"><span class="t"><b>Показывать</b>

      <button class="tgl ${ed.enabled !== false ? "on" : ""}" id="bn-en"></button></div></div>
    <div class="err" id="bn-err"></div>
    <div class="two" style="margin-top:8px">${ed.id ? `<button class="btn danger" id="bn-del">${ic("trash")}Удалить</button>` : ""}
      <button class="btn blue" id="bn-ok">${ic("check")}Сохранить</button></div>`);

  const stage = $("bned");
  // картинка с бота: берём один раз, дальше предпросмотр рисуется без мигания
  if(ed.bg.image && !ed._local) assetUrl("banner", ed.bg.image).then((u) => {
    if(u && $("bned") === stage){ ed._local = u; paint(); }
  });
  const paint = () => {
    keepArts(stage, () => { stage.innerHTML = bannerHtml(ed, 0); });
    fillBannerImages(stage);
    sizeBanners(stage);
    after(stage);
    markSel();
  };
  const markSel = () => {
    stage.querySelectorAll(".bl").forEach((el) => el.classList.toggle("sel", +el.dataset.li === ed._sel));
    stage.classList.toggle("bgsel", ed._sel === "bg");
    $("bn-layers").querySelectorAll("[data-ls]").forEach((b) => b.classList.toggle("on", b.dataset.ls === String(ed._sel)));

    $("bn-layers").querySelectorAll("[data-ls]").forEach((b) => b.onclick = () => {

    });

  const cur = () => (typeof ed._sel === "number" ? ed.layers[ed._sel] : null);

  /* Панель выбранного слоя. Перерисовывается при выборе другого слоя; при

  const drawProps = () => {

        : `<input type="text" id="lp-text" maxlength="${L.type === "button" ? 24 : L.type === "timer" ? 30 : 140}"
            placeholder="${L.type === "timer" ? "Подпись, например «До конца»" : "Текст"}" value="${esc(L.text || "")}">`}
      ${L.type === "timer" ? `<label>Отсчёт до</label><input type="datetime-local" id="lp-to" value="${dtLocal(L.to)}">` : ""}
      ${L.type === "button" ? `<label>Куда ведёт</label>${segHtml("lp-act", [["go", "Раздел"], ["url", "Ссылка"]], L.action || "go")}
        <div id="lp-go" style="margin-top:10px;display:${L.action !== "url" ? "block" : "none"}">${segHtml("lp-tg", BN_GO,
          L.action !== "url" ? L.target || "sniper" : "sniper").replace('class="seg"', 'class="seg wrap"')}</div>
        <input type="text" id="lp-url" placeholder="https://t.me/..." style="margin-top:10px;display:${L.action === "url" ? "block" : "none"}"
          value="${esc(L.action === "url" ? L.target || "" : "")}">` : ""}
      ${slider("lp-size", "Размер", L.type === "gift" ? 6 : 2, L.type === "gift" ? 90 : 20, .1, L.size)}
      ${slider("lp-rot", "Поворот", -180, 180, 1, L.r || 0, "°")}
      ${textual ? `<label>Цвет текста</label>${swatches("lp-color", L.color || "#ffffff")}
        <label>Начертание</label>${segHtml("lp-w", [["400", "Обычный"], ["600", "Полужирный"], ["800", "Жирный"]], String(L.weight || 600))}
        <div class="group plain" style="margin-top:12px">
          <div class="row"><span class="t"><b>Тень</b></span><button class="tgl ${L.shadow ? "on" : ""}" id="lp-sh"></button></div>
          <div class="row"><span class="t"><b>Обводка</b></span><button class="tgl ${L.outline ? "on" : ""}" id="lp-ol"></button></div></div>
        <label>${L.type === "button" ? "Цвет кнопки" : "Подложка"}</label>${swatches("lp-bg", L.bgc || "", L.type !== "button")}` : ""}
      <div class="bnlact"><button id="lp-up">${ic("up")}Выше</button><button id="lp-dn">${ic("down")}Ниже</button>
        <button id="lp-cp">${ic("plus")}Копия</button><button id="lp-del" class="red">${ic("trash")}Убрать</button></div></div>`;
    const upd = () => { paint(); };
    const range = (id, key) => {
      $(id).oninput = () => { L[key] = Number($(id).value); $(id + "-v").textContent = Math.round(L[key] * 10) / 10 + (id === "lp-rot" ? "°" : ""); upd(); };
    };
    range("lp-size", "size"); range("lp-rot", "r");
    if($("lp-text")) $("lp-text").oninput = () => { L.text = $("lp-text").value; upd(); drawLayersSoft(); };
    if($("lp-to")) $("lp-to").onchange = () => { L.to = fromLocal($("lp-to").value); upd(); };
    if(L.type === "button"){
      bindSeg("lp-act", (k) => {
        L.action = k;
        $("lp-go").style.display = k === "go" ? "block" : "none";
        $("lp-url").style.display = k === "url" ? "block" : "none";
        L.target = k === "go" ? (($("lp-tg").querySelector("button.on") || {}).dataset.k || "sniper") : $("lp-url").value.trim();
      });
      bindSeg("lp-tg", (k) => { L.target = k; });
      $("lp-url").oninput = () => { L.target = $("lp-url").value.trim(); };
    }
    if(textual){
      bindSwatches("lp-color", (v) => { L.color = v; upd(); });
      bindSwatches("lp-bg", (v) => { L.bgc = v; upd(); });
      bindSeg("lp-w", (k) => { L.weight = Number(k); upd(); });
      $("lp-sh").onclick = () => { L.shadow = !L.shadow; $("lp-sh").classList.toggle("on", L.shadow); haptic(); upd(); };
      $("lp-ol").onclick = () => { L.outline = !L.outline; $("lp-ol").classList.toggle("on", L.outline); haptic(); upd(); };
    }
    if(L.type === "gift"){
      $("lp-gift").onclick = () => pickCollection(async (slug) => { L.coll = slug; L.model = ""; editBanner(ed); }, "Подарок для баннера");
      loadCatalog(L.coll).then((cat) => {
        if(!$("lp-models") || cur() !== L) return;
        const items = (cat.models || []).map((m) => ({ name: m.name, pct: m.pct }));
        const mp = pickGrid("lp-mp", items, L.model ? [L.model] : [], "model", L.coll, true);
        $("lp-models").innerHTML = `<div class="hint" style="margin:8px 4px 0">Модель - необязательно</div>${mp.html}`;
        mp.draw("");
        $("lp-mp").addEventListener("pick", () => { L.model = mp.value()[0] || ""; upd(); });
      });
    }
    const reorder = (to) => {
      const i = ed._sel;
      if(to < 0 || to >= ed.layers.length) return;
      const [x] = ed.layers.splice(i, 1);
      ed.layers.splice(to, 0, x);
      ed._sel = to; haptic(); paint(); drawLayers();
    };
    $("lp-up").onclick = () => reorder(ed._sel + 1);       // выше = ближе к зрителю
    $("lp-dn").onclick = () => reorder(ed._sel - 1);
    $("lp-cp").onclick = () => {
      if(ed.layers.length >= 14){ toast("Не больше 14 слоёв", "help"); return; }
      const c = JSON.parse(JSON.stringify(L));

      ed.layers.push(c); ed._sel = ed.layers.length - 1; haptic(); paint(); drawLayers(); drawProps();
    };
    $("lp-del").onclick = () => {
      ed.layers.splice(ed._sel, 1);
      ed._sel = ed.layers.length ? Math.min(ed._sel, ed.layers.length - 1) : null;
      haptic(); paint(); drawLayers(); drawProps();

  // имя слоя в списке меняется по мере ввода текста, без пересборки панели
  const drawLayersSoft = () => {
    const L = cur(), b = $("bn-layers").querySelector(`[data-ls="${ed._sel}"]`);
    if(L && b) b.lastChild.textContent = String(layerName(L)).slice(0, 18);
  };
  const drawCrop = () => {
    const box = $("bn-crop");
    if(!box) return;
    if(!hasImg()){ box.innerHTML = ""; return; }
    const bg = ed.bg;
    box.innerHTML = `<div class="hint">Выбери «Картинка фона» в слоях и двигай её пальцем, двумя - увеличивай.</div>

      ${slider("bc-x", "По ширине", 0, 100, 1, bg.x ?? 50, "%")}
      ${slider("bc-y", "По высоте", 0, 100, 1, bg.y ?? 50, "%")}
      ${slider("bc-d", "Затемнение", 0, .8, .05, bg.dim ?? .25)}`;
    [["bc-z", "z"], ["bc-x", "x"], ["bc-y", "y"], ["bc-d", "dim"]].forEach(([id, k]) => {
      $(id).oninput = () => { bg[k] = Number($(id).value); $(id + "-v").textContent = Math.round(bg[k] * 100) / 100; paint(); };
    });
  };
  const syncSliders = () => {
    const L = cur();
    if(L && $("lp-size")){
      $("lp-size").value = L.size; $("lp-size-v").textContent = Math.round(L.size * 10) / 10;
      $("lp-rot").value = L.r || 0; $("lp-rot-v").textContent = Math.round(L.r || 0) + "°";
    }
    if(ed._sel === "bg" && $("bc-z")){
      [["bc-z", "z"], ["bc-x", "x"], ["bc-y", "y"]].forEach(([id, k]) => {
        $(id).value = ed.bg[k]; $(id + "-v").textContent = Math.round(ed.bg[k] * 100) / 100;
      });
    }
  };

  /* Пальцы на предпросмотре. Во время жеста двигаем только сам элемент (без
     пересборки баннера), в данные записываем сразу, ползунки - в конце. */
  const pts = new Map();
  let g = null;
  const gesture = () => {
    const [a, b] = [...pts.values()];
    return { d: Math.hypot(b.x - a.x, b.y - a.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  };
  const snap = () => {
    const L = cur();
    return L ? { x: L.x, y: L.y, r: L.r || 0, size: L.size } : ed._sel === "bg" ? { x: ed.bg.x ?? 50, y: ed.bg.y ?? 50, z: ed.bg.z || 1 } : null;
  };
  const live = () => {
    const L = cur();
    const bnr = stage.querySelector(".bnr");
    if(L){
      const el = stage.querySelector(`.bl[data-li="${ed._sel}"]`);
      if(el) el.setAttribute("style", layerCss(L, false));
    } else if(ed._sel === "bg"){
      const im = bnr && bnr.querySelector(".bnr-img");
      if(im){ im.style.objectPosition = `${ed.bg.x}% ${ed.bg.y}%`; im.style.transformOrigin = `${ed.bg.x}% ${ed.bg.y}%`;
        im.style.transform = `scale(${ed.bg.z})`; }
    }
  };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  stage.onpointerdown = (e) => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pts.size === 1){
      const hit = e.target.closest("[data-li]");
      const was = ed._sel;
      ed._sel = hit ? +hit.dataset.li : hasImg() ? "bg" : null;
      if(was !== ed._sel){ markSel(); drawProps(); }
    }
    const r = stage.getBoundingClientRect();
    g = { s: snap(), p: { x: e.clientX, y: e.clientY }, w: r.width, h: r.height, two: pts.size >= 2 ? gesture() : null };
  };
  stage.onpointermove = (e) => {
    if(!g || !pts.has(e.pointerId) || !g.s) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const L = cur();
    if(pts.size >= 2 && g.two){
      const now = gesture(), k = now.d / g.two.d, rot = now.ang - g.two.ang;
      if(L){ L.size = Math.round(clamp(g.s.size * k, L.type === "gift" ? 6 : 2, L.type === "gift" ? 90 : 20) * 10) / 10;
        L.r = Math.round(clamp(g.s.r + rot, -180, 180)); }
      else ed.bg.z = Math.round(clamp(g.s.z * k, 1, 6) * 100) / 100;
    } else if(pts.size === 1){
      const dx = (e.clientX - g.p.x) / g.w * 100, dy = (e.clientY - g.p.y) / g.h * 100;
      if(L){ L.x = Math.round(clamp(g.s.x + dx, -10, 110) * 10) / 10; L.y = Math.round(clamp(g.s.y + dy, -10, 110) * 10) / 10; }
      // картинку тянем за палец: вправо - видно больше её левой части
      else { ed.bg.x = Math.round(clamp(g.s.x - dx / g.s.z, 0, 100)); ed.bg.y = Math.round(clamp(g.s.y - dy / g.s.z, 0, 100)); }
    }
    live();
  };
  const up = (e) => {
    pts.delete(e.pointerId);
    if(pts.size){
      // один палец остался - продолжаем перетаскивание от него
      const [p] = [...pts.values()];
      g = { ...g, s: snap(), p, two: null };
    } else { g = null; syncSliders(); }
  };
  stage.onpointerup = stage.onpointercancel = up;

  // ---------- кнопки добавления ----------
  document.querySelectorAll("#panel [data-add]").forEach((b) => b.onclick = () => {
    if(ed.layers.length >= 14){ toast("Не больше 14 слоёв", "help"); return; }
    const kind = b.dataset.add;
    haptic();
    const push = (L) => { ed.layers.push(L); ed._sel = ed.layers.length - 1; };
    if(kind === "gift"){
      if(ed.layers.filter((x) => x.type === "gift").length >= 6){ toast("Не больше 6 подарков", "help"); return; }
      pickCollection(async (slug) => { push({ type: "gift", coll: slug, model: "", x: 78, y: 52, r: 0, size: 30 }); editBanner(ed); },
        "Подарок для баннера");
      return;
    }
    if(kind === "text") push({ type: "text", text: "Новый текст", x: 50, y: 50, r: 0, size: 6, color: "#ffffff", weight: 800, shadow: true });
    if(kind === "button") push({ type: "button", text: "Открыть", action: "go", target: "sniper", x: 50, y: 78, r: 0, size: 4.2,
      color: "#000000", bgc: "#ffffff", weight: 700 });
    if(kind === "timer") push({ type: "timer", text: "До конца", to: Math.floor(Date.now() / 1000) + 86400, x: 50, y: 25, r: 0,
      size: 4.8, color: "#ffffff", weight: 800, shadow: true });
    paint(); drawLayers(); drawProps();
  });

  // ---------- фон ----------
  bindSeg("bn-bg", (k) => {
    $("bn-colors").style.display = k === "color" ? "block" : "none";
    $("bn-imgbox").style.display = k === "image" ? "block" : "none";
    if(k === "color"){
      ed.bg = { color: (ed.bg.color && ed.bg.color !== "image") ? ed.bg.color : "violet" }; delete ed._local;
      if(ed._sel === "bg") ed._sel = ed.layers.length ? 0 : null;
      paint(); drawLayers(); drawProps();
    } else if(!hasImg()) $("bn-file").click();
  });
  $("bn-colors").querySelectorAll("[data-c]").forEach((b) => b.onclick = () => {
    $("bn-colors").querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); haptic();
    ed.bg = { color: b.dataset.c }; delete ed._local; paint();
  });
  $("bn-cc").oninput = (e) => {
    $("bn-colors").querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
    const p = $("bn-cc").parentElement;
    p.classList.add("on");
    ed.bg = { color: e.target.value.toLowerCase() }; delete ed._local;
    p.setAttribute("style", bnBgCss(ed.bg));
    paint();
  };
  $("bn-up").onclick = () => $("bn-file").click();
  $("bn-file").onchange = async () => {
    const f = $("bn-file").files[0];
    if(!f) return;
    $("bn-err").textContent = "";
    $("bn-up").disabled = true;
    try{
      const data = await shrinkImage(f, 1400);
      ed._local = data;
      ed.bg = { image: "", x: 50, y: 50, z: 1, dim: .25 };
      ed._sel = "bg";
      // картинку выбрали - переключатель фона тоже на «Картинка»
      const sb = $("bn-bg").querySelector('[data-k="image"]');
      if(sb && !sb.classList.contains("on")) sb.click();
      paint(); drawLayers(); drawProps();
      const r = await call("banner_image", { data });
      ed.bg.image = r.file;
      toast("Картинка загружена");
    }catch(e){
      delete ed._local;
      if(!ed.bg.image) ed.bg = { color: "violet" };
      $("bn-err").textContent = e.message || "Картинка не загрузилась";
      paint(); drawLayers(); drawProps();
    }finally{ if($("bn-up")) $("bn-up").disabled = false; $("bn-file").value = ""; }
  };

  // ---------- эффекты, нажатие, аудитория, расписание ----------
  $("bn-shine").onclick = () => { ed.fx.shine = !ed.fx.shine; $("bn-shine").classList.toggle("on", ed.fx.shine); haptic(); paint(); };
  $("bn-spk").onclick = () => { ed.fx.sparkles = !ed.fx.sparkles; $("bn-spk").classList.toggle("on", ed.fx.sparkles); haptic(); paint(); };
  bindSeg("bn-tap", (k) => {
    $("bn-tapgo").style.display = k === "go" ? "block" : "none";
    $("bn-tapurl").style.display = k === "url" ? "block" : "none";
  });
  bindSeg("bn-taptg", () => {});
  bindSeg("bn-aud", () => {});
  $("bn-en").onclick = () => { $("bn-en").classList.toggle("on"); haptic(); };
  const read = () => {
    const act = ($("bn-tap").querySelector("button.on") || {}).dataset.k || "none";
    ed.tap = act === "go" ? { action: "go", target: ($("bn-taptg").querySelector("button.on") || {}).dataset.k || "sniper" }
      : act === "url" ? { action: "url", target: $("bn-tapurl").value.trim() } : { action: "none", target: "" };
    ed.audience = ($("bn-aud").querySelector("button.on") || {}).dataset.k || "all";
    ed.when = { from: fromLocal($("bn-from").value), to: fromLocal($("bn-to").value) };
    ed.enabled = $("bn-en").classList.contains("on");
  };
  $("bn-ok").onclick = async () => {
    read();
    if(ed._local && !ed.bg.image){ $("bn-err").textContent = "Картинка ещё загружается - подожди пару секунд"; return; }
    const banner = { id: ed.id, bg: ed.bg, layers: ed.layers, fx: ed.fx, tap: ed.tap, audience: ed.audience,
      when: ed.when, enabled: ed.enabled };
    try{
      await call("banner_save", { banner });
      hapticOk(); toast("Баннер сохранён"); adminBanners(); refreshState();
    }catch(e){ $("bn-err").textContent = e.message; }
  };
  if($("bn-del")) $("bn-del").onclick = () => {
    const ask = async (yes) => {
      if(!yes) return;
      try{ await call("banner_del", { id: ed.id }); toast("Баннер удалён"); adminBanners(); refreshState(); }
      catch(e){ $("bn-err").textContent = e.message; }
    };
    if(TG && TG.showConfirm) TG.showConfirm(tr("Удалить баннер?"), ask); else ask(true);
  };

  paint(); drawLayers(); drawProps(); drawCrop();
}
/* Картинку сжимаем в приложении: с телефона приходят снимки по 5-10 МБ, а баннеру
   хватает 1400 точек по ширине. JPEG 85% - около 150-300 КБ. Раньше картинка
   открывалась через img.decode(), а он есть не во всех встроенных браузерах
   Telegram: своя картинка не загружалась вовсе. Теперь - обычная загрузка. */
async function shrinkImage(file, maxW){
  if(file.size > 25e6) throw new Error("Картинка больше 25 МБ");
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, fail) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => fail(new Error("Не получилось открыть картинку. Попробуй JPEG или PNG"));
      im.src = url;
    });
    if(!img.naturalWidth) throw new Error("Не получилось открыть картинку. Попробуй JPEG или PNG");
    const k = Math.min(1, maxW / img.naturalWidth);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let q = .85, out = c.toDataURL("image/jpeg", q);
    // бот принимает до 1.5 МБ: большие снимки дожимаем качеством
    while(out.length > 1.9e6 && q > .4){ q -= .15; out = c.toDataURL("image/jpeg", q); }
    return out;
  }finally{ URL.revokeObjectURL(url); }
}

/* ===================== БОНУСНЫЕ ЗВЁЗДЫ =====================
   Внутренний баланс: тратится ТОЛЬКО на слот Flip Master и только целиком, вывести
   его нельзя. Всё считает бот по своим часам (bonus.py): приложение сообщает только
   «нажал», а не «когда», поэтому перевод даты в телефоне ничего не даёт. Здесь лишь
   показ: время до бонуса берём из ответа бота и досчитываем от момента ответа. */

  days_7: ["Неделя с ботом", "открывал приложение 7 дней", "clock", "#9d8cff", "#5a48d6"],
  days_15: ["Свой человек", "открывал приложение 15 дней", "crown", "#ffe066", "#d39b00"],
  days_30: ["Ветеран", "открывал приложение 30 дней", "shield", "#ff8a80", "#c9352b"],
  nuke: ["Ядерная кнопка", "нажал на ядерную кнопку", "nuke", "#b6ff5c", "#3f9a12"],
  guess_win: ["Чутьё", "угадал цену подарка", "target", "#ff7ad9", "#b32893"],

};
const LEDGER_NAMES = { daily: "Ежедневный бонус", nuke: "Ядерная кнопка", slot: "Слот Flip Master",
  refund: "Возврат за слот", guess: "Угадай цену" };

function BN(){ return (S && S.bonus) || null; }
/* Секунд до следующего бонуса по часам бота. */
function bonusWait(){
  const b = BN();
  if(!b || !b.next_claim) return 0;
  const passed = Math.floor((Date.now() - (b._at || Date.now())) / 1000);
  return Math.max(0, b.next_claim - b.now - passed);
}
function fmtWait(s){
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} ч ${m} мин` : `${Math.max(1, m)} мин`;
}
function nStars(n){ return `${n} ${plural(n, "звезда", "звезды", "звёзд")}`; }

/* Полёт «+N» от точки к счётчику баланса, счётчик подпрыгивает и досчитывает. */
function flyStars(x, y, n, to){
  const pill = $("b-pill");
  const el = document.createElement("div");
  el.className = "plusfly";
  el.innerHTML = `${ic("star")}+${n}`;
  document.body.appendChild(el);
  el.style.left = x + "px"; el.style.top = y + "px";
  const t = pill ? pill.getBoundingClientRect() : null;
  const dx = t ? t.left + t.width / 2 - x : 0, dy = t ? t.top + t.height / 2 - y : -80;
  const a = el.animate([
    { transform: "translate(-50%,-50%) scale(.4)", opacity: 0 },
    { transform: "translate(-50%,-180%) scale(1.5)", opacity: 1, offset: .35 },
    { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`, opacity: .9 }],
    { duration: REDUCED ? 10 : 1100, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
  a.onfinish = () => {
    el.remove();
    const num = $("b-num");
    if(num){
      const from = Number(num.textContent) || 0;
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 500);
        num.textContent = Math.round(from + (to - from) * k);
        if(k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    if(pill){
      pill.animate([{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }],
        { duration: 420, easing: "cubic-bezier(.3,1.6,.5,1)" });
      const r = pill.getBoundingClientRect();
      FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 26, speed: 4.5, size: 5, life: 40,
        colors: ["#ffd60a", "#ffe68a", "#ffffff"] });
    }
  };
}

let claiming = false;
async function claimBonus(){
  const logo = $("lg-tap");
  if(!logo || claiming) return;
  const r = logo.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const wait = bonusWait();
  if(wait){
    haptic("rigid");
    logo.animate([{ transform: "rotate(0)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(12deg)" },
      { transform: "rotate(-6deg)" }, { transform: "rotate(0)" }], { duration: 480 });
    FX.burst(x, y, { n: 12, speed: 3, size: 4, life: 28 });
    toast(`Следующий бонус через ${fmtWait(wait)}`, "clock");
    return;
  }
  claiming = true;
  haptic("heavy");
  if(!REDUCED){
    logo.animate([{ transform: "scale(1) rotate(0)" }, { transform: "scale(.65) rotate(-25deg)", offset: .16 },
      { transform: "scale(1.9) rotate(220deg)", offset: .55 }, { transform: "scale(1) rotate(360deg)" }],
      { duration: 950, easing: "cubic-bezier(.3,1.25,.5,1)" });
    const hint = $("lg-hint");
    if(hint) hint.animate([{ opacity: 1 }, { opacity: 0, transform: "translateX(30px) scale(.6)" }],
      { duration: 300, fill: "forwards" });
  }
  try{
    const res = await call("bonus_claim", {});
    hapticOk();
    if(!REDUCED){
      FX.flash(x, y);
      // кольцо искр с логотипа, звёзды веером вверх и маленький салют
      FX.burst(x, y, { n: 90, speed: 10, size: 7, life: 70, ring: 18,
        colors: ["#ffd60a", "#ffe68a", "#ffffff", "#5a9bff", "#8fbcff"] });
      FX.burst(x, y, { n: 40, angle: -Math.PI / 2, spread: 1.4, speed: 13, size: 6, life: 90, gravity: .25,
        kind: "star", colors: ["#ffd60a", "#ffffff"] });
      ringPulse(x, y, "#ffd60a");
      setTimeout(FX.confetti, 380);
    }
    flyStars(x, y, res.got || 2, res.stars);
    setTimeout(() => { render(); claiming = false; }, REDUCED ? 50 : 1700);
  }catch(e){
    claiming = false;
    toast(e.message, "clock");
  }
}
function ringPulse(x, y, color, big){
  const el = document.createElement("div");
  el.className = "ringp";
  el.style.cssText = `left:${x}px;top:${y}px;border-color:${color}`;
  document.body.appendChild(el);
  const a = el.animate([{ transform: "translate(-50%,-50%) scale(.2)", opacity: 1 },
    { transform: `translate(-50%,-50%) scale(${big || 5})`, opacity: 0 }],
    { duration: big ? 1300 : 750, easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards" });
  a.onfinish = () => el.remove();
}

/* Новые достижения бот присылает в state.bonus.new - показываем один раз. */
const ACH_SHOWN = new Set();
function bonusNews(){
  const b = BN();
  if(!b || !b.new || !b.new.length) return;
  const fresh = b.new.filter((k) => !ACH_SHOWN.has(k) && ACH[k]);
  fresh.forEach((k) => ACH_SHOWN.add(k));
  if(!fresh.length) return;
  const k = fresh[0], prize = (b.prizes || {})[k] || 0;
  setTimeout(() => {
    hapticOk();
    toast(`Достижение: ${ACH[k][0]}${prize ? ` (+${prize})` : ""}`, "star");
    if(fxOn("add")) FX.burst(innerWidth / 2, 60, { n: 50, speed: 7, size: 6, life: 60,
      colors: [ACH[k][3], "#ffffff", "#ffd60a"] });
  }, 900);
}

/* ---------- 3D-медали ----------
   Лицо и оборот - SVG (чёткие на любом размере): металлический обод с насечкой,
   скошенный край, эмаль цвета достижения с лучами-гильошем, лавровая ветвь и
   выпуклый значок. Ребро - настоящий цилиндр из узких полосок по окружности
   (preserve-3d), с насечкой и светотенью. Блик на лице бежит при повороте: свет
   стоит на месте, а медаль крутится. */
const METALS = {
  gold: ["#fff7c9", "#f3cd55", "#a7700b", "#ffe28c", "#7d5000"],
  steel: ["#f5f7fa", "#bcc3cd", "#5c636f", "#e1e5ea", "#454b55"],
};
let MEDAL_N = 0;
function medalSvg(o){
  const u = "md" + (++MEDAL_N), m = METALS[o.metal] || METALS.gold;
  const stops = (rev) => (rev ? [...m].reverse() : m).map((c, i) => `<stop offset="${[0, .28, .52, .74, 1][i]}" stop-color="${c}"/>`).join("");
  let rays = "";
  for(let i = 0; i < 48; i++){
    const a = i * Math.PI / 24;
    rays += `M${(100 + Math.cos(a) * 12).toFixed(1)} ${(100 + Math.sin(a) * 12).toFixed(1)}L${(100 + Math.cos(a) * 80).toFixed(1)} ${(100 + Math.sin(a) * 80).toFixed(1)}`;
  }
  const field = `<circle cx="100" cy="100" r="99" fill="url(#${u}m)"/>
    <circle cx="100" cy="100" r="98.4" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="94.5" fill="none" stroke="${m[4]}" stroke-opacity=".6" stroke-width="5" stroke-dasharray="1.3 1.7"/>
    <circle cx="100" cy="100" r="90" fill="url(#${u}r)"/>
    <circle cx="100" cy="100" r="82" fill="url(#${u}e)"/>
    <path d="${rays}" stroke="#fff" stroke-opacity=".09" stroke-width="1.4"/>
    <circle cx="100" cy="100" r="81" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="3"/>
    <circle cx="100" cy="100" r="82.5" fill="none" stroke="url(#${u}m)" stroke-width="2.6"/>`;
  const defs = `<defs>
    <linearGradient id="${u}m" x1="0" y1="0" x2="1" y2="1">${stops(false)}</linearGradient>
    <linearGradient id="${u}r" x1="0" y1="0" x2="1" y2="1">${stops(true)}</linearGradient>
    <radialGradient id="${u}e" cx=".42" cy=".36" r=".72"><stop offset="0" stop-color="${o.c1}"/><stop offset="1" stop-color="${o.c2}"/></radialGradient>
    <linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <path id="${u}t" d="M36 100A64 64 0 0 1 164 100"/><path id="${u}b" d="M43 104A57 57 0 0 0 157 104"/></defs>`;
  const gloss = `<path d="M30 92A70 70 0 0 1 170 92C150 70 50 70 30 92z" fill="url(#${u}g)" opacity=".55"/>`;
  if(o.back){
    const big = o.prize ? `<text x="100" y="124" text-anchor="middle" font-size="62" font-weight="900" fill="#000" fill-opacity=".35">+${o.prize}</text>
        <text x="100" y="121" text-anchor="middle" font-size="62" font-weight="900" fill="url(#${u}m)">+${o.prize}</text>`
      : `<g transform="translate(64 62) scale(3)"><use href="#i-star" width="24" height="24" fill="none" stroke="url(#${u}m)" stroke-width="2.2" stroke-linejoin="round"/></g>`;
    return `<svg viewBox="0 0 200 200" class="msvg">${defs}${field}
      <text font-size="14.5" font-weight="800" letter-spacing=".6" fill="url(#${u}m)"><textPath href="#${u}t" startOffset="50%" text-anchor="middle">${esc(o.title || "")}</textPath></text>
      ${big}
      <text font-size="11" font-weight="800" letter-spacing="2" fill="url(#${u}m)" opacity=".85"><textPath href="#${u}b" startOffset="50%" text-anchor="middle" data-notx>GIFTFLIP</textPath></text>
      ${gloss}</svg>`;
  }
  // лавровая ветвь по нижней дуге
  let leaves = "";
  for(const side of [-1, 1]){
    for(let i = 0; i < 7; i++){
      const deg = 90 + side * (24 + i * 15), a = deg * Math.PI / 180;
      const x = 100 + Math.cos(a) * 68, y = 100 + Math.sin(a) * 68;
      leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="7.4" ry="3" transform="rotate(${(deg + 90 + side * 28).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
  }
  let stars = "";
  [-20, 0, 20].forEach((d, i) => {
    const a = (-90 + d) * Math.PI / 180;
    stars += `<path d="${starPath(100 + Math.cos(a) * 68, 100 + Math.sin(a) * 68, i === 1 ? 6 : 4.2)}"/>`;
  });
  const icon = (stroke, w, dy, op) => `<use href="#i-${o.icon}" width="24" height="24" fill="none" stroke="${stroke}" stroke-width="${w}"
      stroke-linecap="round" stroke-linejoin="round" transform="translate(0 ${dy})" ${op ? `stroke-opacity="${op}"` : ""}/>`;
  const lock = o.locked ? `<g transform="translate(124 124)"><circle r="17" fill="#1c1f25" stroke="url(#${u}m)" stroke-width="2"/>
      <path d="M-6-2v-4a6 6 0 0 1 12 0v4" fill="none" stroke="url(#${u}m)" stroke-width="2.6"/>
      <rect x="-8.5" y="-2" width="17" height="12" rx="2.5" fill="url(#${u}m)"/></g>` : "";
  return `<svg viewBox="0 0 200 200" class="msvg">${defs}${field}
    <g fill="url(#${u}m)" stroke="#000" stroke-opacity=".3" stroke-width=".6">${leaves}${stars}</g>
    <g transform="translate(57 55) scale(3.58)">${icon("#000", 2.9, .55, ".45")}${icon(`url(#${u}m)`, 2.3, 0)}${icon("#fff", .7, -.3, ".45")}</g>
    ${gloss}${lock}</svg>`;
}
/* Монета целиком: лицо, оборот, ребро и тень под ней. d - диаметр в точках. */
function coinHtml(o){
  const d = o.d, t = Math.max(3, Math.round(d * .085)), r = d / 2;
  const n = d > 90 ? 36 : 18, w = Math.PI * d / n + .7;
  const m = METALS[o.metal] || METALS.gold;
  let edge = "";
  for(let i = 0; i < n; i++){
    const a = i * 360 / n;
    // светотень ребра: светлее сверху слева, темнее снизу
    const dark = (.42 - .38 * Math.cos((a - 315) * Math.PI / 180)).toFixed(2);
    edge += `<i style="width:${w.toFixed(2)}px;height:${t}px;margin:${-t / 2}px 0 0 ${(-w / 2).toFixed(2)}px;
      transform:rotateZ(${a.toFixed(1)}deg) translateY(${(-r + .4).toFixed(1)}px) rotateX(90deg);
      background:linear-gradient(rgba(0,0,0,${dark}),rgba(0,0,0,${dark})),repeating-linear-gradient(90deg,${m[1]} 0 1.2px,${m[2]} 1.2px 2.2px)"></i>`;
  }
  return `<div class="bcoin ${o.cls || ""}" style="--d:${d}px"><div class="cshadow"></div><div class="c3">${edge}
    <div class="cf front" style="transform:translateZ(${t / 2}px)">${medalSvg(o)}<i class="spec"><b></b></i></div>
    <div class="cf back" style="transform:rotateY(180deg) translateZ(${t / 2}px)">${medalSvg(Object.assign({}, o, { back: true }))}<i class="spec"><b></b></i></div>
    </div></div>`;
}
/* Большую монету крутит цикл: пальцем, с инерцией. Маленькие в сетке стоят под
   постоянным углом и в каждом кадре не перерисовываются: десяток монет, которые
   качались все сразу, сильно тормозили телефон. Блик двигается сдвигом
   (transform), а не перерисовкой градиента - это видеокарта делает почти даром. */
const COINS = new Set();
let coinRaf = 0;
function coinTick(t){
  for(const el of COINS){
    if(!document.body.contains(el)){ COINS.delete(el); continue; }
    const s = el._st;
    if(!s.drag){
      s.ang += s.vel;
      s.vel += ((REDUCED ? 0 : .6) - s.vel) * .03;     // к спокойному вращению
      s.tilt += (8 - s.tilt) * .06;
    }
    paintCoin(el);
  }
  coinRaf = COINS.size ? requestAnimationFrame(coinTick) : 0;
}
function paintCoin(el){
  const s = el._st, rad = s.ang * Math.PI / 180;
  el._c3.style.transform = `rotateX(${s.tilt.toFixed(1)}deg) rotateY(${s.ang.toFixed(1)}deg)`;
  // блик: пятно в 3 раза шире монеты, сдвигаем его так, чтобы центр шёл по лицу
  const sx = 34 + Math.sin(rad) * 62, sy = 26 - s.tilt * 1.3;
  const dy = ((sy - 26) / 2).toFixed(1);
  if(el._sp[0]) el._sp[0].style.transform = `translate(${((sx - 50) / 3).toFixed(1)}%,${dy}%)`;
  if(el._sp[1]) el._sp[1].style.transform = `translate(${((50 - sx) / 3).toFixed(1)}%,${dy}%)`;
  el._sh.style.transform = `scaleX(${(.5 + .5 * Math.abs(Math.cos(rad))).toFixed(2)})`;
}
function spinCoin(el, sway){
  if(!el) return;
  el._c3 = el.querySelector(".c3");
  el._sh = el.querySelector(".cshadow");
  el._sp = [...el.querySelectorAll(".spec b")];
  el._st = { ang: sway ? nkR(-30, -16) : -20, tilt: sway ? 9 : 8, vel: REDUCED ? 0 : .6, drag: null };
  if(sway){ paintCoin(el); return; }      // маленькая: один раз под углом, без цикла
  if(!sway){
    let last = 0;
    el.onpointerdown = (e) => {
      el._st.drag = { y: e.clientY }; last = e.clientX; el._st.vel = 0;
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove = (e) => {
      const s = el._st;
      if(!s.drag) return;
      const dx = e.clientX - last;
      last = e.clientX;
      s.ang += dx * .9; s.vel = dx * .9;
      s.tilt = Math.max(-35, Math.min(35, 8 - (e.clientY - s.drag.y) * .3));
    };
    el.onpointerup = el.onpointercancel = () => { el._st.drag = null; };
  }
  paintCoin(el);
  COINS.add(el);
  if(!coinRaf) coinRaf = requestAnimationFrame(coinTick);
}

function openAchievements(){
  const b = BN();
  if(!b) return;

      metal: on ? "gold" : "steel", c1: on ? c1 : "#6b7180", c2: on ? c2 : "#262a32", locked: !on });
  };

  openSheet(`<h2><span class="tile yellow">${ic("medal")}</span>Достижения</h2>
    <p class="sub">Медали можно крутить пальцем. За многие - бонусные звёзды.</p>
    <div id="ach-top" class="achtop"></div>
    <div class="achgrid">${keys.map((k) => `<button class="achc ${k === sel ? "on" : ""}" data-k="${k}">${medal(k, "small", 62)}
      <span>${esc(ACH[k][0])}</span></button>`).join("")}</div>`);
  paintTop();
  $("panel").querySelectorAll(".achgrid .bcoin").forEach((c) => spinCoin(c, true));
